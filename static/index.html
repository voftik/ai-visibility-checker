<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#CDD5DE">
  <meta
    name="description"
    content="RW+ AIV проверяет техническую доступность сайта для ИИ и видимость бренда в ответах популярных моделей."
  >
  <title>AI Visibility — RW+</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <script src="/static/vendor/marked.min.js" defer></script>
  <script
    src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"
    integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly"
    crossorigin="anonymous"
    defer
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
    integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD"
    crossorigin="anonymous"
    defer
  ></script>
  <style>
    :root {
      color-scheme: light;
      --canvas: #cdd5de;
      --canvas-deep: #bcc7d2;
      --surface: #ffffff;
      --surface-soft: #edf1f5;
      --surface-muted: #e2e8ee;
      --ink: #101011;
      --ink-soft: #465463;
      --ink-muted: #687788;
      --line: rgba(16, 16, 17, 0.14);
      --line-strong: rgba(16, 16, 17, 0.28);
      --accent: #ff324b;
      --accent-hover: #e92b42;
      --accent-active: #cf2238;
      --success: #18794e;
      --warning: #996400;
      --danger: #b42336;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --duration-fast: 120ms;
      --duration-default: 200ms;
      --duration-slow: 320ms;
      --ease-out: cubic-bezier(0, 0, 0.2, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --shell: min(1480px, calc(100vw - 40px));
      --reading: 760px;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: rgba(16, 16, 17, 0.1);
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-shell {
      width: var(--shell);
      margin-inline: auto;
    }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 16px 0 0;
      pointer-events: none;
    }

    body[data-view="report"] .topbar-wrap {
      position: relative;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      min-width: 0;
      min-height: 64px;
      padding: 5px 18px 5px 5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(16, 16, 17, 0.12);
      text-decoration: none;
      border-radius: 999px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .brand-logo-surface {
      width: 127px;
      height: 54px;
      padding: 8px 14px 9px;
      flex: 0 0 127px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      border-radius: 999px;
    }

    .brand-logo {
      display: block;
      width: 98px;
      height: 37px;
    }

    .brand-product {
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    .topbar-actions {
      min-height: 64px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(16, 16, 17, 0.12);
      border-radius: 999px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .topbar-actions .button-light {
      background: transparent;
    }

    .topbar-actions .button-light:hover {
      background: var(--surface-soft);
    }

    .button {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.015em;
      text-decoration: none;
      cursor: pointer;
      transition:
        background-color var(--duration-fast) var(--ease-out),
        color var(--duration-fast) var(--ease-out),
        transform 90ms var(--ease-out);
    }

    .button:hover {
      background: #2b2b2e;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .button-accent {
      background: var(--accent);
    }

    .button-accent:hover {
      background: var(--accent-hover);
    }

    .button-accent:active {
      background: var(--accent-active);
    }

    .button-light {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .button-light:hover {
      background: var(--surface-muted);
    }

    .button-quiet {
      background: transparent;
      color: var(--ink);
    }

    .button-quiet:hover {
      background: var(--surface-soft);
    }

    .button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      min-height: calc(100vh - 180px);
    }

    .hero {
      padding: clamp(42px, 4.8vw, 72px) 0 64px;
    }

    .hero-stage {
      display: grid;
      grid-template-columns: minmax(0, 1.36fr) minmax(420px, 0.84fr);
      gap: clamp(34px, 4vw, 72px);
      align-items: stretch;
    }

    .hero-copy {
      min-width: 0;
      padding-top: clamp(14px, 1.6vw, 26px);
    }

    .hero-title,
    .page-title,
    .report-title {
      margin: 0;
      max-width: 1300px;
      font-size: clamp(46px, 7.4vw, 112px);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.96;
      text-wrap: balance;
    }

    .hero-title .accent-word {
      color: var(--accent);
    }

    .hero-title-line {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .rotating-word {
      position: relative;
      display: inline-block;
      overflow: hidden;
      color: var(--accent);
      perspective: 600px;
      vertical-align: baseline;
    }

    .rotating-word-current {
      display: block;
      transform-origin: 50% 50%;
      backface-visibility: hidden;
      will-change: transform, opacity, filter;
    }

    .rotating-word-measure {
      position: absolute;
      inset: 0 auto auto 0;
      visibility: hidden;
      white-space: nowrap;
      pointer-events: none;
    }

    .hero-question {
      display: inline-block;
      margin-left: 0.01em;
    }

    .hero-lead {
      max-width: 710px;
      margin: 34px 0 0;
      color: var(--ink-soft);
      font-size: clamp(18px, 2vw, 27px);
      line-height: 1.34;
      text-wrap: pretty;
    }

    .domain-form {
      margin-top: 44px;
      max-width: 860px;
    }

    .hero-visual {
      position: relative;
      min-width: 0;
      min-height: 520px;
      margin: 0;
      overflow: hidden;
      background: #a6b2c1;
      border-radius: var(--radius-lg);
      isolation: isolate;
    }

    .hero-visual::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .hero-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 61% center;
    }

    .domain-label {
      display: block;
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .domain-control {
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 999px;
      transition:
        box-shadow var(--duration-default) var(--ease-out),
        border-color var(--duration-default) var(--ease-out);
    }

    .domain-control:focus-within {
      border-color: var(--ink);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.42);
    }

    .domain-input {
      width: 100%;
      min-width: 0;
      height: 62px;
      padding: 0 24px;
      border: 0;
      outline: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      font-weight: 600;
    }

    .domain-input::placeholder {
      color: #8794a1;
      opacity: 1;
    }

    .domain-submit {
      min-width: 218px;
      min-height: 62px;
    }

    .form-meta {
      min-height: 25px;
      margin: 12px 18px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      color: var(--ink-soft);
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .form-error {
      color: var(--danger);
      font-weight: 600;
    }

    .signal-rail {
      margin-top: clamp(64px, 6vw, 92px);
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line-strong);
    }

    .signal-item {
      position: relative;
      min-height: 180px;
      padding: 26px 30px 24px 0;
      border-right: 1px solid var(--line-strong);
    }

    .signal-item:not(:first-child) {
      padding-left: 30px;
    }

    .signal-item:last-child {
      border-right: 0;
    }

    .signal-number {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    .signal-title {
      max-width: 22ch;
      margin: 30px 0 8px;
      font-size: clamp(20px, 2vw, 28px);
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .signal-copy {
      max-width: 38ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .section-heading-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line-strong);
    }

    .section-title {
      margin: 0;
      font-size: clamp(28px, 3.3vw, 48px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .section-note {
      max-width: 42ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      text-align: right;
    }

    .history-page {
      padding: clamp(64px, 7vw, 108px) 0 120px;
    }

    .history-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.42fr);
      align-items: end;
      gap: clamp(36px, 7vw, 112px);
      margin-bottom: clamp(40px, 5vw, 72px);
    }

    .history-title {
      max-width: 950px;
      margin: 0;
      font-size: clamp(48px, 7.2vw, 108px);
      font-weight: 600;
      line-height: 0.96;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .history-lead {
      max-width: 42ch;
      margin: 0 0 8px;
      color: var(--ink-soft);
      font-size: clamp(16px, 1.4vw, 20px);
      line-height: 1.45;
      text-wrap: pretty;
    }

    .history-table-shell {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 80px rgba(49, 63, 78, 0.08);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .history-table th {
      height: 58px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-align: left;
      text-transform: uppercase;
    }

    .history-table td {
      height: 96px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    .history-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .history-table tbody tr {
      transition: background-color var(--duration-default) var(--ease-out);
    }

    .history-table tbody tr:hover {
      background: var(--surface-soft);
    }

    .history-domain {
      min-width: 0;
    }

    .history-domain strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: clamp(17px, 1.55vw, 22px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .history-domain span {
      display: block;
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .history-date {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .history-state {
      display: inline-flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .state-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 999px;
      background: var(--ink-muted);
    }

    .state-dot.completed {
      background: var(--success);
    }

    .state-dot.active {
      background: var(--accent);
    }

    .state-dot.recovering {
      background: var(--surface);
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 50, 75, 0.14);
    }

    .state-dot.failed {
      background: var(--danger);
    }

    .history-state-copy {
      display: grid;
      gap: 3px;
    }

    .history-state-copy strong {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .history-state-copy small {
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .history-action-cell {
      text-align: right;
    }

    .history-open {
      min-width: 154px;
      padding-inline: 18px;
      white-space: nowrap;
    }

    .history-open svg {
      transition: transform var(--duration-default) var(--ease-out);
    }

    .history-open:hover svg {
      transform: translateX(3px);
    }

    .empty-history {
      min-height: 440px;
      padding: clamp(34px, 5vw, 72px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 460px);
      align-items: center;
      gap: clamp(32px, 7vw, 108px);
      overflow: hidden;
    }

    .empty-history-copy {
      max-width: 510px;
    }

    .empty-history-copy h2 {
      margin: 0;
      font-size: clamp(32px, 4vw, 58px);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .empty-history-copy p {
      max-width: 42ch;
      margin: 18px 0 28px;
      color: var(--ink-soft);
      font-size: 17px;
    }

    .empty-history-visual {
      width: 100%;
      max-width: 440px;
      height: auto;
      justify-self: end;
    }

    .history-feedback {
      min-height: 280px;
      padding: clamp(30px, 5vw, 64px);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 80px rgba(49, 63, 78, 0.08);
      text-align: center;
    }

    .history-feedback-inner {
      max-width: 520px;
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .history-feedback .loading-mark {
      width: 54px;
      height: 54px;
    }

    .history-feedback h2 {
      margin: 0;
      font-size: clamp(28px, 3.4vw, 44px);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .history-feedback p {
      max-width: 46ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
    }

    .history-sync-note {
      margin-bottom: 12px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
    }

    .history-sync-note .button {
      min-height: 38px;
      padding-inline: 14px;
    }

    .progress-page {
      padding: clamp(36px, 4.2vw, 64px) 0 96px;
    }

    .error-page {
      padding: clamp(64px, 8vw, 118px) 0 120px;
    }

    .progress-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(440px, 1.12fr);
      gap: clamp(48px, 8vw, 128px);
      align-items: start;
    }

    .progress-summary {
      position: sticky;
      top: 118px;
    }

    .progress-visual {
      margin: 32px 0 0;
      overflow: hidden;
      background: #d7dee6;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: var(--radius-md);
    }

    .progress-visual img {
      width: 100%;
      height: auto;
    }

    .progress-domain {
      display: inline-flex;
      margin-bottom: 22px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .progress-value {
      margin: 0;
      font-size: clamp(96px, 12vw, 184px);
      font-weight: 500;
      line-height: 0.82;
      letter-spacing: -0.075em;
      font-variant-numeric: tabular-nums;
    }

    .progress-value small {
      font-size: 0.32em;
      letter-spacing: -0.025em;
    }

    .progress-value--queued,
    .progress-value--recovering {
      font-size: clamp(76px, 9vw, 138px);
      letter-spacing: -0.06em;
    }

    .progress-stage-title {
      max-width: 12ch;
      margin: 42px 0 14px;
      font-size: clamp(30px, 3.6vw, 54px);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .progress-detail {
      max-width: 50ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 17px;
      text-wrap: pretty;
    }

    .eta {
      margin-top: 28px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--line-strong);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.015em;
    }

    .eta strong {
      color: var(--ink);
      font-weight: 700;
    }

    .execution-slot {
      margin-top: 18px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-md);
    }

    .execution-slot-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .execution-slot-head span {
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .execution-slot-head strong {
      font-size: 13px;
      font-weight: 750;
      text-align: right;
    }

    .execution-slot-visual {
      margin-top: 15px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px 70px;
      align-items: center;
    }

    .execution-ticket {
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .execution-ticket span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .execution-ticket strong {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 12px;
    }

    .execution-flow {
      height: 1px;
      background: var(--line-strong);
    }

    .execution-slot-cell {
      position: relative;
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      background: var(--ink);
      border-radius: 22px;
      color: white;
      font-size: 20px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .execution-slot-cell::after {
      content: "сейчас";
      position: absolute;
      right: 0;
      bottom: -17px;
      left: 0;
      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .execution-slot--running .execution-slot-cell {
      background: var(--accent);
    }

    .execution-slot--running .execution-ticket {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .execution-slot-copy {
      margin: 26px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .stage-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line-strong);
    }

    .stage-row {
      position: relative;
      min-height: 112px;
      padding: 24px 0;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: start;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      opacity: 0.56;
      transition:
        opacity var(--duration-default) var(--ease-out),
        transform var(--duration-default) var(--ease-out);
    }

    .stage-row.done,
    .stage-row.active {
      opacity: 1;
    }

    .stage-row.active {
      transform: translateX(8px);
    }

    .stage-index {
      position: relative;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stage-row.done .stage-index {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .stage-row.active .stage-index {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .stage-row.active .stage-index::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid var(--accent);
      border-radius: inherit;
      animation: active-ring 1.8s var(--ease-out) infinite;
    }

    @keyframes active-ring {
      0% { transform: scale(0.82); opacity: 0.7; }
      70%, 100% { transform: scale(1.22); opacity: 0; }
    }

    .stage-name {
      margin: 3px 0 6px;
      font-size: 20px;
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .stage-copy {
      max-width: 54ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .stage-status {
      margin-top: 7px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stage-row.active .stage-status {
      color: var(--accent);
    }

    .report-page {
      padding: clamp(54px, 7vw, 104px) 0 120px;

    .report-hero {

    .report-intro {

    .report-hero .report-title {

      font-size: clamp(36px, min(3.45vw, 7svh), 54px);

      overflow-wrap: anywhere;

    .headline-segment {

      letter-spacing: inherit;

    .report-verdict {

    .report-hero .report-verdict {

    }

    .report-cover {

    .metric-rail {

    .metric {

    .metric-label {

      color: var(--ink-soft);

      font-weight: 700;

      text-transform: uppercase;

    .metric-number {

    }

    .metric-number.is-text {
      max-width: 14ch;
      color: var(--ink-soft);
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.1;
      letter-spacing: -0.025em;
    }

    .metric-context {
      display: flex;
      flex-wrap: wrap;

      font-weight: 600;
      line-height: 1.35;

    .coverage-badge {
      display: inline-flex;
      min-height: 24px;
      padding: 4px 8px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #465463;
      background: #e8edf2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.035em;
      line-height: 1;
      text-transform: uppercase;
    }

    .coverage-badge.is-limited {
      color: #a24100;
      background: #fff0cf;
      border-color: #f2d18a;
    }

    .coverage-badge.is-complete {
      color: #007d59;
      background: #ddf7ef;
      border-color: #a6e5d1;
    }

    .metric-unit {
      margin-left: 5px;
      color: var(--ink-muted);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .report-block {
      padding: clamp(76px, 9vw, 136px) 0 0;
    }

    .report-grid {
      display: grid;
      grid-template-columns: minmax(240px, 310px) minmax(0, 1fr);
      gap: clamp(34px, 5vw, 76px);
      align-items: start;
    }

    .report-grid > * {
      min-width: 0;
    }

    .report-aside {
      position: sticky;
      top: 120px;
    }

    .report-aside p {
      max-width: 34ch;
      margin: 18px 0 0;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .chart-surface {
      padding: clamp(24px, 3vw, 42px);
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .chart-title {
      margin: 0 0 28px;
      font-size: clamp(24px, 2.5vw, 36px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .chart-card {
      padding: clamp(22px, 3vw, 38px);

      background: var(--surface);
      border-radius: var(--radius-lg);

    .chart-card + .chart-card,

    .chart-card-head {

    .chart-card-head .chart-title {

    .chart-title-domain {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    .chart-kicker {
      flex: 0 0 auto;
      margin: 5px 0 0;
      color: var(--ink-muted);

      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .entity-chart-explainer {
      margin: 22px 0 0;

      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .entity-chart-explainer > div {
      min-width: 0;
      padding: 15px 18px 16px 0;
    }

    .entity-chart-explainer > div + div {
      padding-left: 18px;
      border-left: 1px solid var(--line);
    }

    .entity-chart-explainer dt {
      color: var(--ink-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .entity-chart-explainer dd {
      margin: 7px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .entity-chart-legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .entity-chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .entity-chart-legend i {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 2px;
      background: #aeb9c4;
    }

    .entity-chart-legend .is-parent i {
      background: var(--accent);
    }

    .entity-chart-legend .is-portfolio i {
      background: #465463;
    }

    .competitor-chart-tooltip {
      --tooltip-accent: #aeb9c4;
      width: min(340px, calc(100vw - 48px));
      padding: 15px 16px 16px;
      color: var(--ink);
      white-space: normal;
    }

    .competitor-chart-tooltip.is-parent {
      --tooltip-accent: var(--accent);
    }

    .competitor-chart-tooltip.is-portfolio {
      --tooltip-accent: #465463;
    }

    .competitor-chart-tooltip__context {
      color: var(--ink-muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .competitor-chart-tooltip__title {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .competitor-chart-tooltip__title::before {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--tooltip-accent);
      content: "";
    }

    .competitor-chart-tooltip__title strong {
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .competitor-chart-tooltip__role {
      margin: 4px 0 0 17px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.35;
    }

    .competitor-chart-tooltip__value {
      margin-top: 14px;
      padding: 12px 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

    .competitor-chart-tooltip__value strong {
      color: var(--ink);
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .competitor-chart-tooltip__value span {
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .competitor-chart-tooltip__copy {
      margin: 11px 0 0;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 550;
      line-height: 1.52;
    }

    .competitor-chart-tooltip__copy strong {
      color: var(--ink);
      font-weight: 800;
    }

    .competitor-chart-tooltip__meaning {
      padding: 10px 11px;
      border-radius: 9px;
      background: var(--surface-soft);
    }

    .competitor-chart-tooltip__caveat {
      color: var(--ink-muted);
      font-size: 10px;
    }

    .interactive-chart {
      width: 100%;
      min-height: 350px;
      margin-top: 22px;
      border-top: 1px solid var(--line);
    }

    .interactive-chart.chart-tall {
      min-height: 510px;
    }

    .interactive-chart.chart-compact {
      min-height: 290px;
    }

    .family-status-panel {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .family-status-overview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .family-status-summary {
      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.45;
    }

    .family-status-legend {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.03em;
    }

    .family-status-legend::before {
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      border: 2px solid #e9fff0;
      border-radius: 50%;
      background: #36bd68;
      box-shadow:
        0 0 0 1px rgba(20, 121, 75, 0.42),
        0 0 12px rgba(54, 189, 104, 0.58);
      content: "";
    }

    .family-status-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .family-status-card {
      --lamp-core: #bdc7d1;
      --lamp-mid: #8b98a5;
      --lamp-edge: #596775;
      --lamp-glow: rgba(89, 103, 117, 0.18);
      position: relative;
      min-width: 0;
      min-height: 228px;
      padding: 15px 12px 14px;
      display: flex;
      align-items: center;
      flex-direction: column;
      isolation: isolate;
      border: 1px solid rgba(16, 16, 17, 0.16);
      border-radius: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.12)),
        repeating-linear-gradient(
          0deg,
          rgba(16, 16, 17, 0.018) 0,
          rgba(16, 16, 17, 0.018) 1px,
          transparent 1px,
          transparent 4px
        ),
        #e8edf1;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -1px 0 rgba(16, 16, 17, 0.06),
        0 8px 18px rgba(56, 68, 80, 0.08);
      outline: none;
      transition:
        border-color var(--duration-default) var(--ease-out),
        box-shadow var(--duration-default) var(--ease-out),
        transform var(--duration-default) var(--ease-out);
    }

    .family-status-card:hover,
    .family-status-card:focus-visible {
      border-color: color-mix(in srgb, var(--provider-color) 42%, #7c8792);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.94),
        0 12px 26px rgba(56, 68, 80, 0.13);
      transform: translateY(-2px);
    }

    .family-status-card:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--provider-color) 30%, transparent);
      outline-offset: 3px;
    }

    .family-status-card.is-available {
      --lamp-core: #dcffe6;
      --lamp-mid: #58d980;
      --lamp-edge: #14794b;
      --lamp-glow: rgba(54, 199, 104, 0.5);
    }

    .family-status-card.is-blocked {
      --lamp-core: #e2d5d7;
      --lamp-mid: #9c7c82;
      --lamp-edge: #56343a;
      --lamp-glow: rgba(112, 65, 75, 0.13);
    }

    .family-status-card.is-partial {
      --lamp-core: #fff4ca;
      --lamp-mid: #f1bd3e;
      --lamp-edge: #9a6800;
      --lamp-glow: rgba(241, 189, 62, 0.4);
    }

    .family-status-card .provider-identity {
      width: 100%;
      justify-content: center;
    }

    .family-status-card .provider-identity-mark {
      width: 32px;
      height: 32px;
      flex-basis: 32px;
      border-radius: 9px;
    }

    .family-status-card .provider-identity-name {
      font-size: 11px;
    }

    .family-status-lamp {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 18px auto 14px;
      display: block;
      flex: 0 0 92px;
      filter: drop-shadow(0 7px 7px rgba(16, 16, 17, 0.18));
    }

    .family-status-lamp-bezel,
    .family-status-lamp-glass,
    .family-status-lamp-filament {
      position: absolute;
      display: block;
    }

    .family-status-lamp-bezel {
      inset: 0;
      border: 1px solid #77818b;
      border-radius: 50%;
      background:
        conic-gradient(
          from 214deg,
          #47515b,
          #eef2f4 12%,
          #747e88 25%,
          #f9fbfc 43%,
          #626d78 61%,
          #dfe5e9 79%,
          #4b5661
        );
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.42),
        inset 0 0 0 8px #9ba5ad,
        inset 0 0 0 10px rgba(16, 16, 17, 0.38),
        0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .family-status-lamp-bezel::before,
    .family-status-lamp-bezel::after {
      position: absolute;
      top: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #697580 58%, #313941 100%);
      box-shadow: 0 1px 1px rgba(16, 16, 17, 0.4);
      content: "";
    }

    .family-status-lamp-bezel::before {
      left: 17px;
    }

    .family-status-lamp-bezel::after {
      right: 17px;
    }

    .family-status-lamp-glass {
      inset: 15px;
      border: 1px solid color-mix(in srgb, var(--lamp-edge) 78%, #ffffff);
      border-radius: 50%;
      background:
        radial-gradient(circle at 31% 24%, #ffffff 0 5%, rgba(255, 255, 255, 0.7) 6%, transparent 18%),
        radial-gradient(circle at 50% 45%, var(--lamp-core) 0 23%, var(--lamp-mid) 54%, var(--lamp-edge) 100%);
      box-shadow:
        inset 7px 9px 12px rgba(255, 255, 255, 0.28),
        inset -7px -9px 13px rgba(16, 16, 17, 0.28),
        0 0 0 3px rgba(255, 255, 255, 0.2),
        0 0 24px var(--lamp-glow);
    }

    .family-status-card.is-available .family-status-lamp-glass {
      animation: family-lamp-breathe 2.8s ease-in-out infinite;
    }

    .family-status-card:not(.is-available) .family-status-lamp-filament {
      opacity: 0.3;
    }

    .family-status-lamp-filament {
      left: 50%;
      bottom: 27px;
      width: 18px;
      height: 9px;
      border: 2px solid rgba(255, 255, 255, 0.62);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      opacity: 0.8;
      transform: translateX(-50%);
    }

    .family-status-lamp-filament::before,
    .family-status-lamp-filament::after {
      position: absolute;
      bottom: 5px;
      width: 2px;
      height: 13px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.54);
      content: "";
    }

    .family-status-lamp-filament::before {
      left: 2px;
      transform: rotate(-15deg);
    }

    .family-status-lamp-filament::after {
      right: 2px;
      transform: rotate(15deg);
    }

    @keyframes family-lamp-breathe {
      0%, 100% { filter: brightness(0.96) saturate(0.96); }
      50% { filter: brightness(1.08) saturate(1.08); }
    }

    .family-status-state,
    .family-status-detail {
      display: block;
      text-align: center;
    }

    .family-status-state {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }

    .family-status-card.is-available .family-status-state {

    }

      font-weight: 500;

      vertical-align: top;

      font-weight: 700;

    .data-table-page {

    .data-table strong {

    .data-table small {

      line-height: 1.35;
    }

    .audit-finding {

      grid-template-columns: 94px minmax(0, 1fr);
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .audit-severity {
      width: fit-content;
      height: fit-content;
      padding: 6px 9px;
      background: var(--surface-soft);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .audit-severity.critical {
      background: rgba(180, 35, 54, 0.1);
      color: var(--danger);
    }

    .audit-severity.important {
      background: rgba(153, 100, 0, 0.12);
      color: var(--warning);
    }

    .audit-finding h4 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .audit-finding p {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .audit-finding-action {
      color: var(--ink) !important;
      font-weight: 600;
    }

    .barrier-list {
      margin: 30px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .barrier {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }

    .barrier-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .barrier-copy {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .illustration {
      margin: clamp(70px, 9vw, 130px) 0 0;
    }

    .illustration-media {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background:

        var(--canvas-deep);
      border-radius: var(--radius-lg);
    }

    .illustration-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .illustration-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--ink-soft);
      text-align: center;
    }

    .illustration-caption {
      padding: 20px 4px 0;
      display: grid;
      grid-template-columns: minmax(0, 0.45fr) minmax(0, 1fr);
      gap: 30px;
    }

    .illustration-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .illustration-copy {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .compare-panel {
      min-height: 280px;
      padding: 28px;
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .compare-panel.accent-panel {
      background: var(--ink);
      color: white;
    }

    .compare-label {
      margin: 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .accent-panel .compare-label {
      color: #aeb8c2;
    }

    .compare-score {
      margin: 46px 0 36px;
      font-size: clamp(62px, 7vw, 104px);
      font-weight: 600;
      line-height: 0.8;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
    }

    .compare-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .accent-panel .compare-stats {
      border-color: rgba(255, 255, 255, 0.22);
    }

    .compare-stat span {
      display: block;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .accent-panel .compare-stat span {
      color: #aeb8c2;
    }

    .compare-stat strong {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .comparison-table {
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .comparison-row {
      min-height: 70px;
      padding: 16px 22px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) repeat(2, minmax(110px, 0.42fr));
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .comparison-row:last-child {
      border-bottom: 0;
    }

    .comparison-header {
      min-height: 58px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .comparison-label {
      font-size: 13px;
      font-weight: 700;
    }

    .comparison-value {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .comparison-value strong,
    .comparison-value small {
      display: block;
    }

    .comparison-value strong {
      font-size: 18px;
      font-weight: 600;
    }

    .comparison-value small {
      margin-top: 5px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
    }

    .comparison-value.is-incomplete strong {
      color: var(--warning);
      font-size: 13px;
    }

    .comparison-value.is-unavailable strong {
      color: var(--ink-muted);
      font-size: 13px;
    }

    .comparison-value.is-observational strong {
      color: #007d59;
    }

    .comparison-observation-note {
      margin: 0;
      padding: 15px 18px;
      border-top: 1px solid var(--line);
      background: #eef8f4;
      color: #315f53;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .comparison-note {
      margin: 14px 0 0;
      padding: 20px 22px;
      background: var(--surface);
      border-radius: var(--radius-md);
      color: var(--ink-soft);
      font-size: 13px;
    }

    .paired-comparison {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .paired-context {
      max-width: 76ch;
      margin: 0 0 18px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.55;
    }

    .paired-comparison-table {
      min-width: 760px;
      table-layout: fixed;
    }

    .paired-comparison-table th:first-child {
      width: 31%;
    }

    .paired-comparison-table th:nth-child(2),
    .paired-comparison-table th:nth-child(3) {
      width: 18%;
    }

    .paired-comparison-table th:last-child {
      width: 33%;
    }

    .paired-comparison-table th,
    .paired-comparison-table td {
      padding: 18px 16px;
      vertical-align: middle;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .paired-metric strong {
      font-size: 14px;
    }

    .paired-metric small,
    .paired-value small,
    .paired-delta small {
      margin-top: 6px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.45;
    }

    .paired-value strong {
      font-size: clamp(22px, 2.2vw, 32px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .paired-value.is-incomplete strong {
      color: var(--warning);
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .paired-value.is-unavailable strong {
      color: var(--ink-muted);
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .paired-delta-pill {
      width: fit-content;
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .paired-delta-pill.is-positive {
      background: #ddf7ef;
      color: #007d59;
    }

    .paired-delta-pill.is-negative {
      background: #fff0cf;
      color: #8a5a00;
    }

    .paired-delta-pill.is-neutral {
      background: #e8edf2;
      color: #465463;
    }

    .paired-delta-pill.is-unavailable {
      background: #edf1f5;
      color: var(--ink-muted);
    }

    .matrix {
      margin-top: 14px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .matrix-row {
      min-height: 72px;
      padding: 16px 22px;
      display: grid;
      grid-template-columns: minmax(120px, 0.7fr) repeat(3, minmax(84px, 0.35fr));
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .matrix-row:last-child {
      border-bottom: 0;
    }

    .matrix-header {
      min-height: 50px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .matrix-name {
      font-weight: 700;
    }

    .matrix-value {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .matrix-value strong,
    .matrix-value small {
      display: block;
    }

    .matrix-value strong {
      font-size: inherit;
    }

    .matrix-value small {
      margin-top: 4px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
    }

    .matrix-value.is-incomplete strong {
      color: var(--warning);
      font-size: 12px;
    }

    .matrix-value.is-unavailable strong {
      color: var(--ink-muted);
    }

    .intent-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line-strong);
      border-left: 1px solid var(--line-strong);
    }

    .intent-cell {
      min-height: 150px;
      padding: 22px;
      border-right: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

    .intent-code {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .intent-score {
      margin-top: 25px;
      font-size: 42px;
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .intent-scores {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .intent-score-group span {
      display: block;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .intent-score-group strong {
      display: block;
      margin-top: 6px;
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .intent-label {
      margin-top: 12px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .prose-wrap {
      max-width: 1120px;
      margin-inline: auto;
      padding: clamp(76px, 10vw, 150px) 0 0;
    }

    .full-analysis {
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

    .full-analysis > summary {
      min-height: 82px;
      padding: 22px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      list-style: none;
    }

    .full-analysis > summary::-webkit-details-marker {
      display: none;
    }

    .full-analysis > summary::after {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      content: "+";
      font-size: 20px;
      font-weight: 500;
      transition: transform var(--duration-default) var(--ease-in-out);
    }

    .full-analysis[open] > summary::after {
      transform: rotate(45deg);
    }

    .full-analysis .prose {
      padding: 10px 0 70px;
    }

    .analysis-library {
      padding: clamp(76px, 10vw, 150px) 0 0;
    }

    .analysis-library-head {
      display: grid;
      grid-template-columns: minmax(0, 0.72fr) minmax(320px, 0.48fr);
      gap: clamp(28px, 5vw, 72px);
      align-items: end;

    .analysis-library-title {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(38px, 5vw, 72px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;

    .analysis-library-copy {
      max-width: 48ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .analysis-card-grid {
      margin-top: clamp(28px, 4vw, 48px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .analysis-card {
      min-width: 0;
      overflow: clip;
      scroll-margin-top: 112px;
      background: var(--surface);
      border: 1px solid rgba(16, 16, 17, 0.1);
      border-radius: var(--radius-lg);
      transition:
        border-color var(--duration-default) var(--ease-out),
        background-color var(--duration-default) var(--ease-out);
    }

    .analysis-card[open],
    .analysis-card--overview {
      grid-column: 1 / -1;
    }

    .analysis-card[open] {
      border-color: var(--line-strong);
    }

    .analysis-card > summary {
      min-height: 174px;
      padding: clamp(20px, 2.4vw, 30px);
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 40px;
      gap: clamp(16px, 2vw, 26px);
      align-items: start;
      cursor: pointer;
      list-style: none;
    }

    .analysis-card > summary::-webkit-details-marker {
      display: none;
    }

    .analysis-card > summary::marker {
      content: "";

    .analysis-card[open] > summary {
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
    }

    .analysis-card-visual {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--ink);
      transition:
        background-color var(--duration-default) var(--ease-out),
        transform var(--duration-default) var(--ease-out);
    }

    .analysis-card[open] .analysis-card-visual {
      background: var(--surface);
    }

    .analysis-card > summary:hover .analysis-card-visual {
      transform: translateY(-2px);
    }

    .analysis-card-visual svg {
      width: 54px;
      height: 54px;
      overflow: visible;
    }

    .analysis-svg-accent {
      fill: var(--accent);
      stroke: none;
    }

    .analysis-card-heading {
      min-width: 0;
    }

    .analysis-card-number {
      display: block;
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .analysis-card-title {
      display: block;
      font-size: clamp(20px, 2vw, 29px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .analysis-card-lead {
      max-width: 68ch;
      margin-top: 12px;
      display: block;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .analysis-card-toggle {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      align-self: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      transition:
        background-color var(--duration-default) var(--ease-out),
        color var(--duration-default) var(--ease-out),
        transform var(--duration-default) var(--ease-in-out);

    .analysis-card-toggle svg {
      width: 18px;
      height: 18px;

    .analysis-card[open] .analysis-card-toggle {
      background: var(--ink);
      color: var(--surface);
      transform: rotate(180deg);
    }

    .analysis-card-panel {
      padding: clamp(26px, 4vw, 52px);
      animation: analysis-card-open var(--duration-slow) var(--ease-out) both;
    }

    @keyframes analysis-card-open {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {

        transform: translateY(0);
      }

    .analysis-card-panel .prose {

    }

    .analysis-card-panel .prose > p,
    .analysis-card-panel .prose > ul,
    .analysis-card-panel .prose > ol,
    .analysis-card-panel .prose > blockquote {
      max-width: 82ch;
    }

    .analysis-card-panel .prose h2 {
      display: none;
    }

    .analysis-subcard-grid {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .analysis-subcard {
      min-width: 0;
      padding: clamp(20px, 2.4vw, 30px);
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    .analysis-subcard h3 {
      margin: 0 0 18px;
      font-size: clamp(18px, 1.8vw, 24px);
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .analysis-subcard .prose {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.65;
    }

    .analysis-subcard .prose p:last-child,
    .analysis-subcard .prose ul:last-child,
    .analysis-subcard .prose ol:last-child {
      margin-bottom: 0;
    }

    .analysis-table-scroll {
      max-width: 100%;
      margin: 26px 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      -webkit-overflow-scrolling: touch;
    }

      min-width: 680px;
      margin: 0;

      font-size: 13px;

    .analysis-card-panel .prose th,
    .analysis-card-panel .prose td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .analysis-card-panel .prose th {
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .analysis-empty {
      margin-top: 28px;
      padding: 28px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      color: var(--ink-soft);

      overflow-wrap: anywhere;

    .prose {

      color: var(--ink);
      font-size: 17px;
      line-height: 1.72;
    }

    .prose > :first-child {
      margin-top: 0;
    }

    .prose h1 {
      display: none;
    }

    .prose h2 {
      margin: 72px 0 22px;
      font-size: clamp(30px, 3.8vw, 50px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .prose h3 {
      margin: 42px 0 14px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.24;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .prose p {
      margin: 0 0 22px;
      text-wrap: pretty;
    }

    .prose ul,
    .prose ol {
      margin: 0 0 28px;
      padding-left: 24px;
    }

    .prose li {
      margin-bottom: 10px;
    }

    .prose strong {
      font-weight: 700;
    }

    .prose a {
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;

    .methodology {
      margin-top: 100px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

            >

  <footer>
    <div class="site-shell footer-row">
      <span>© 2026 RW+. Экспресс-диагностика AI visibility.</span>
      <a href="https://rw.plus" target="_blank" rel="noopener noreferrer">rw.plus ↗</a>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const app = document.getElementById("app");
      const topbarActions = document.getElementById("topbar-actions");
      const toast = document.getElementById("toast");
      let headlineRotationTimeline = null;
      let headlineRotationDelay = null;

      const stopHeadlineRotation = () => {
        headlineRotationTimeline?.kill();
        headlineRotationDelay?.kill();
        headlineRotationTimeline = null;
        headlineRotationDelay = null;
      };

      const initHeadlineRotation = () => {
        stopHeadlineRotation();
        const root = document.querySelector("[data-rotating-word]");
        const current = root?.querySelector(".rotating-word-current");
        const measure = root?.querySelector(".rotating-word-measure");
        if (!root || !current || !measure) return;

        const words = String(root.dataset.words || "")
          .split(",")
          .map((word) => word.trim())
          .filter(Boolean);
        const prefersReducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        if (words.length < 2 || prefersReducedMotion || !window.gsap) return;

        let index = Math.max(0, words.indexOf(current.textContent.trim()));
        const measureWidth = (word) => {
          measure.textContent = word;
          return Math.ceil(measure.getBoundingClientRect().width) + 1;
        };

        const scheduleNext = () => {
          if (!root.isConnected) return;
          headlineRotationDelay = window.gsap.delayedCall(2.35, rotateWord);
        };

        const rotateWord = () => {
          if (!root.isConnected) return;
          const nextIndex = (index + 1) % words.length;
          const nextWord = words[nextIndex];
          const nextWidth = measureWidth(nextWord);

          headlineRotationTimeline = window.gsap.timeline({
            onComplete: () => {
              index = nextIndex;
              headlineRotationTimeline = null;
              scheduleNext();
            }
          });
          headlineRotationTimeline
            .to(current, {
              yPercent: -112,
              rotationX: 58,
              autoAlpha: 0,
              filter: "blur(8px)",
              duration: 0.36,
              ease: "power3.in"
            }, 0)
            .to(root, {
              width: nextWidth,
              duration: 0.54,
              ease: "power3.inOut"
            }, 0.04)
            .add(() => {
              current.textContent = nextWord;
            }, 0.28)
            .set(current, {
              yPercent: 112,
              rotationX: -58,
              autoAlpha: 0,
              filter: "blur(8px)"
            }, 0.29)
            .to(current, {
              yPercent: 0,
              rotationX: 0,
              autoAlpha: 1,
              filter: "blur(0px)",
              duration: 0.58,
              ease: "power4.out"
            }, 0.31);
        };

        const start = () => {
          if (!root.isConnected) return;
          window.gsap.set(root, {
            width: measureWidth(current.textContent.trim())
          });
          scheduleNext();
        };

        if (document.fonts?.ready) {
          document.fonts.ready.then(start);
        } else {
          requestAnimationFrame(start);
        }
      };

      const stages = [
        {
          key: "site_discovery",
          label: "Изучаем сайт",
          copy: "Находим главную, продуктовые и содержательные страницы."
        },
        {
          key: "technical_access",
          label: "Проверяем доступ для ИИ",
          copy: "Сравниваем серверный HTML, правила обхода и ответы для краулеров."
        },
        {
          key: "scenario_design",
          label: "Формируем сценарии выбора",
          copy: "Определяем бренд, продукты и реальные запросы пользователей."
        },
        {
          key: "web_visibility",
          label: "Сравниваем ответы ИИ-систем",
          copy: "Смотрим, кого модели находят и рекомендуют с актуальным веб-поиском."
        },
        {
          key: "knowledge_gap",
          label: "Сопоставляем режимы исследования",
          copy: "Сравниваем ответы с актуальным поиском и сохранённый контрольный срез."
        },
        {
          key: "report",
          label: "Собираем отчёт и иллюстрации",
          copy: "Связываем доказательства, приоритеты и три поясняющие схемы."
        }
      ];

      const canonicalIntentNames = {
        I: "Информация",
        E: "Сравнение",
        T: "Решение",
        NB: "Потребность",
        NAV: "Источник",
        TR: "Тренд"
      };

      const legacyIntentNames = {
        I: "Информация",
        E: "Оценка",
        T: "Выбор",
        NB: "Категория",
        NAV: "Навигация",
        TR: "Доверие"
      };

      const canonicalIntentDescriptions = {
        I: "Общие сведения и понимание темы",
        E: "Сравнение вариантов и критериев выбора",
        T: "Готовность купить, заказать или принять решение",
        NB: "Задача, боль, ограничение или контекст использования",
        NAV: "Источник, площадка, обзор, агрегатор или точка входа",
        TR: "Тренды, новизна, популярность или меняющееся поведение"
      };

      const legacyIntentDescriptions = {
        I: "Общие информационные вопросы",
        E: "Оценка и сравнение вариантов",
        T: "Выбор поставщика или решения",
        NB: "Поиск категории без названия бренда",
        NAV: "Навигация по типу решения",
        TR: "Доверие и проверка риска"
      };

      const usesCanonicalIntentTaxonomy = (methodology) => (
        methodology?.intent_taxonomy_version === "canonical-v1"
      );

      const intentName = (code, methodology) => (
        (
          usesCanonicalIntentTaxonomy(methodology)
            ? canonicalIntentNames
            : legacyIntentNames
        )[code] || "Сценарий"
      );

      const intentDescription = (code, methodology) => (
        (
          usesCanonicalIntentTaxonomy(methodology)
            ? canonicalIntentDescriptions
            : legacyIntentDescriptions
        )[code] || ""
      );

      const state = {
        view: "loading",
        runs: [],
        run: null,
        shared: false,
        submitting: false,
        domainError: "",
        eventSource: null,
        pollTimer: null,
        runFetchToken: 0,
        historyPollTimer: null,
        historyLoading: false,
        historyError: "",
        historyRefreshInFlight: false,
        historyFetchToken: 0,
        toastTimer: null,
        uiVersionTimer: null
      };
      const uiBuildId = "2026-07-31.29";
      const supportedReportVersions = new Set([
        "2026-07",
        "2026-07-v2",
        "2026-07-v3"
      ]);
      const reportCharts = [];
      const reportChartDisposers = [];
      let reportChartObserver = null;
      let activeAuditTooltip = null;

      const escapeHTML = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

      const compactDomainLabel = (value) => {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const url = new URL(raw.includes("://") ? raw : `https://${raw}`);
          return url.hostname.replace(/^www\./i, "") || raw;
        } catch (_error) {
          return raw
            .replace(/^https?:\/\//i, "")
            .replace(/^www\./i, "")
            .split("/")[0];
        }
      };

      const finiteNumber = (value) => {
        if (
          value === null
          || value === undefined
          || value === ""
          || typeof value === "boolean"
        ) {
          return null;
        }
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      };

      const safeNumber = (value, digits = 0) => {
        const number = finiteNumber(value);
        if (number === null) return "—";
        return new Intl.NumberFormat("ru-RU", {
          maximumFractionDigits: digits,
          minimumFractionDigits: digits
        }).format(number);
      };

      const formatDate = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      };

      const formatEta = (seconds) => {
        const value = finiteNumber(seconds);
        if (value === null || value <= 0) return null;
        const minutes = Math.max(1, Math.ceil(value / 60));
        if (minutes < 60) return `около ${minutes} мин`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `около ${hours} ч ${rest} мин` : `около ${hours} ч`;
      };

      const runLifecycleState = (run) => {
        const explicitState = String(run?.run_state || "").toLowerCase();
        if (
          ["queued", "running", "recovering", "completed", "failed"]
            .includes(explicitState)
        ) {
          return explicitState;
        }
        if (run?.status === "completed") return "completed";
        if (run?.status === "failed") return "failed";
        if (run?.stage_key === "recovering") return "recovering";
        if (["crawling", "analyzing"].includes(run?.status)) return "running";
        return "queued";
      };

      const runRevision = (run) => finiteNumber(run?.state_revision);

      const canApplyRunUpdate = (currentRun, nextRun) => {
        if (!nextRun) return false;
        if (
          currentRun?.id
          && nextRun?.id
          && currentRun.id !== nextRun.id
        ) {
          return false;
        }
        const currentRevision = runRevision(currentRun);
        const nextRevision = runRevision(nextRun);
        if (currentRevision === null) return true;
        if (nextRevision === null) return false;
        return nextRevision >= currentRevision;
      };

      const mergeRunListsByRevision = (currentRuns, nextRuns) => {
        const currentById = new Map(
          currentRuns.map((run) => [run.id, run])
        );
        return nextRuns.map((nextRun) => {
          const currentRun = currentById.get(nextRun.id);
          if (!currentRun || canApplyRunUpdate(currentRun, nextRun)) {
            return { ...currentRun, ...nextRun };
          }
          return currentRun;
        });
      };

      const queuePosition = (run) => {
        const position = finiteNumber(run?.queue_position);
        return position !== null && position > 0
          ? Math.floor(position)
          : null;
      };

      const queueTotal = (run) => {
        const total = finiteNumber(run?.queue_total);
        return total !== null && total > 0
          ? Math.floor(total)
          : null;
      };

      const queuePositionLabel = (run) => {
        const position = queuePosition(run);
        if (position === null) return "";
        const total = queueTotal(run);
        return total !== null
          ? `№ ${position} из ${Math.max(position, total)}`
          : `№ ${position}`;
      };

      const icon = (name) => {
        const paths = {
          arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
          back: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
          share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          check: '<path d="m5 12 4 4L19 6"/>',
          retry: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'
        };
        return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || ""}</svg>`;
      };

      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add("visible");
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => toast.classList.remove("visible"), 3200);
      };

      const fetchJSON = async (url, options = {}) => {
        const response = await fetch(url, {
          ...options,
          cache: options.cache || "no-store",
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        });
        let payload = {};
        try {
          payload = await response.json();
        } catch (_error) {
          payload = {};
        }
        if (!response.ok) {
          throw new Error(payload.detail || "Сервис не ответил. Попробуйте ещё раз.");
        }
        return payload;
      };

      const checkUIVersion = async () => {
        try {
          const payload = await fetchJSON("/api/ui-version");
          const remoteVersion = String(payload?.version || "");
          if (!remoteVersion || remoteVersion === uiBuildId) return;
          const reloadKey = `rwplus-aiv-ui-reload-${remoteVersion}`;
          if (sessionStorage.getItem(reloadKey)) {
            showToast("Интерфейс обновился. Перезагрузите страницу.");
            return;
          }
          sessionStorage.setItem(reloadKey, "1");
          showToast("Обновляем интерфейс отчёта…");
          window.setTimeout(() => window.location.reload(), 450);
        } catch (_error) {
          // A report remains usable when the lightweight version check is offline.
        }
      };

      const loadPublicRuns = async () => {
        const payload = await fetchJSON("/api/runs");
        return Array.isArray(payload) ? payload : [];
      };

      const runStatusLabel = (run) => {
        const lifecycle = runLifecycleState(run);
        if (lifecycle === "completed") return "Проверка завершена";
        if (lifecycle === "failed") return "Нужно продолжить";
        if (lifecycle === "queued") return "В очереди";
        if (lifecycle === "recovering") return "Восстанавливаем проверку";
        return run.stage_label || "Идёт проверка";
      };

      const runStatusDetail = (run) => {
        const lifecycle = runLifecycleState(run);
        const position = queuePositionLabel(run);
        if (lifecycle === "queued") {
          return position
            ? `Позиция в очереди: ${position}`
            : "Позиция обновляется";
        }
        if (lifecycle === "recovering") {
          return position
            ? `Позиция в очереди: ${position}`
            : "Сохранённые данные на месте";
        }
        if (lifecycle === "running") {
          const percent = finiteNumber(run.progress_percent);
          return percent === null
            ? "Выполняется сейчас"
            : `Готово ${Math.max(0, Math.min(100, Math.round(percent)))}%`;
        }
        if (lifecycle === "failed") return "Готовые данные сохранены";
        return "Отчёт доступен";
      };

      const runStatusClass = (run) => {
        const lifecycle = runLifecycleState(run);
        if (lifecycle === "completed") return "completed";
        if (lifecycle === "failed") return "failed";
        if (lifecycle === "recovering") return "recovering";
        return "active";
      };

      const runActionLabel = (run) => {
        const lifecycle = runLifecycleState(run);
        if (lifecycle === "completed") return "Открыть отчёт";
        if (lifecycle === "failed") return "Продолжить";
        return "Смотреть ход";
      };

      const setURL = (runId = null) => {
        if (state.shared) return;
        const url = runId ? `/?run=${encodeURIComponent(runId)}` : "/";
        history.pushState({}, "", url);
      };

      const setHistoryURL = () => {
        if (state.shared) return;
        history.pushState({}, "", "/history");
      };

      const closeStreams = () => {
        state.runFetchToken += 1;
        state.historyFetchToken += 1;
        state.historyRefreshInFlight = false;
        if (state.eventSource) {
          state.eventSource.close();
          state.eventSource = null;
        }
        if (state.pollTimer) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
        }
        if (state.historyPollTimer) {
          clearInterval(state.historyPollTimer);
          state.historyPollTimer = null;
        }
      };

      const sanitizeMarkdownFragment = (markdown) => {
        const template = document.createElement("template");
        const source = String(markdown || "").trim();
        if (!source) return template.content;
        if (!window.marked) {
          const fallback = document.createElement("p");
          fallback.className = "analysis-raw-fallback";
          fallback.textContent = source;
          template.content.appendChild(fallback);
          return template.content;
        }
        template.innerHTML = window.marked.parse(source, {
          mangle: false,
          headerIds: false,
          gfm: true
        });
        const allowed = new Set([
          "H1", "H2", "H3", "H4", "P", "UL", "OL", "LI", "STRONG", "EM",
          "A", "BR", "BLOCKQUOTE", "HR", "PRE", "CODE", "TABLE", "THEAD",
          "TBODY", "TFOOT", "TR", "TH", "TD", "CAPTION"
        ]);
        const blocked = new Set([
          "SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "SVG", "FORM",
          "INPUT", "BUTTON", "TEXTAREA", "SELECT", "VIDEO", "AUDIO"
        ]);
        for (const element of [...template.content.querySelectorAll("*")]) {
          if (blocked.has(element.tagName)) {
            element.remove();
            continue;
          }
          if (!allowed.has(element.tagName)) {
            element.replaceWith(...element.childNodes);
            continue;
          }
          for (const attribute of [...element.attributes]) {
            const keepHref = element.tagName === "A" && attribute.name === "href";
            if (!keepHref) element.removeAttribute(attribute.name);
          }
          if (element.tagName === "A") {
            try {
              const url = new URL(element.getAttribute("href"), window.location.origin);
              if (!["http:", "https:"].includes(url.protocol)) {
                element.removeAttribute("href");
              } else {
                element.setAttribute("href", url.href);
                element.setAttribute("target", "_blank");
                element.setAttribute("rel", "noopener noreferrer");
              }
            } catch (_error) {
              element.removeAttribute("href");
            }
          }
        }
        return template.content;
      };

      const sanitizeMarkdown = (markdown) => {
        const wrapper = document.createElement("div");
        wrapper.appendChild(sanitizeMarkdownFragment(markdown));
        return wrapper.innerHTML;
      };

      const meaningfulAnalysisNodes = (nodes) => nodes.filter((node) => (
        node.nodeType !== Node.TEXT_NODE || String(node.textContent || "").trim()
      ));

      const analysisSectionKind = (title) => {
        const value = String(title || "").toLocaleLowerCase("ru-RU");
        if (/сервер|javascript|рендер|html/.test(value)) return "rendering";
        if (/техничес|краулер|schema|разметк|robots/.test(value)) return "technical";
        if (/безбренд|обнаруж|назван ни разу/.test(value)) return "discovery";
        if (/портфел|юнит|связ/.test(value)) return "portfolio";
        if (/прямой вопрос|расхожд|факт/.test(value)) return "verification";
        if (/памят|веб-поиск/.test(value)) return "memory";
        if (/кто занимает|конкур|место в ответ/.test(value)) return "ranking";
        if (/изменить|приоритет|сейчас|следом/.test(value)) return "actions";
        if (/точност|огранич|границ/.test(value)) return "scope";
        return "overview";
      };

      const analysisIllustrationSVG = (kind) => {
        const start = `
          <svg
            viewBox="0 0 64 64"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
        `;
        const drawings = {
          overview: `
            <path d="M12 45.5V18.5h40v27H12Z"/>
            <path d="M18 38l8-9 7 6 12-13"/>
            <path d="M18 45.5v5h28v-5"/>
            <circle class="analysis-svg-accent" cx="45" cy="22" r="3.2"/>
          `,
          rendering: `
            <rect x="8.5" y="13" width="20" height="38" rx="4"/>
            <rect x="35.5" y="18" width="20" height="28" rx="4"/>
            <path d="M14 21h9M14 27h9M14 33h6"/>
