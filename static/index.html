        bubble.style.top = "0px";
        const anchorRect = anchor.getBoundingClientRect();
        const bubbleRect = bubble.getBoundingClientRect();
        const viewportGap = 12;
        const tooltipGap = 11;
        const center = anchorRect.left + anchorRect.width / 2;
        const maxLeft = Math.max(
          viewportGap,
          window.innerWidth - bubbleRect.width - viewportGap
        );
        const left = Math.min(
          maxLeft,
          Math.max(viewportGap, center - bubbleRect.width / 2)
        );
        const above = anchorRect.top - bubbleRect.height - tooltipGap;
        const below = anchorRect.bottom + tooltipGap;
        const placeBelow = above < viewportGap;
        const maxTop = Math.max(
          viewportGap,
          window.innerHeight - bubbleRect.height - viewportGap
        );
        const top = Math.min(
          maxTop,
          Math.max(viewportGap, placeBelow ? below : above)
        );
        const arrowX = Math.min(
          bubbleRect.width - 18,
          Math.max(18, center - left)
        );

        bubble.style.left = `${Math.round(left)}px`;
        bubble.style.top = `${Math.round(top)}px`;
        bubble.style.setProperty("--audit-tooltip-arrow-x", `${Math.round(arrowX)}px`);
        bubble.classList.toggle("is-below", placeBelow);
        bubble.classList.add("is-visible");
        activeAuditTooltip = { wrapper, bubble };
      };

      const bindAuditTooltips = () => {
        document.querySelectorAll("[data-audit-tooltip]").forEach((wrapper) => {
          const trigger = wrapper.querySelector("[data-audit-tooltip-trigger]");
          if (!trigger) return;
          wrapper.addEventListener("pointerenter", () => showAuditTooltip(wrapper));
          wrapper.addEventListener("pointerleave", () => {
            if (!wrapper.contains(document.activeElement)) hideAuditTooltip();
          });
          trigger.addEventListener("focus", () => showAuditTooltip(wrapper));
          trigger.addEventListener("blur", () => {
            if (!wrapper.matches(":hover")) hideAuditTooltip();
          });
          trigger.addEventListener("pointerup", (event) => {
            if (event.pointerType === "touch") showAuditTooltip(wrapper);
          });
        });
      };

      document.addEventListener("pointerdown", (event) => {
        if (
          activeAuditTooltip
          && !activeAuditTooltip.wrapper.contains(event.target)
        ) {
          hideAuditTooltip();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideAuditTooltip();
      });

      window.addEventListener("scroll", hideAuditTooltip, { passive: true });
      window.addEventListener("resize", hideAuditTooltip);

      const metricPresentation = (
        metric,
        {
          rateKeys = ["mention_rate"],
          countKey = "mention_count",
          countLabel = "Упоминаний",
          compact = false
        } = {}
      ) => {
        const dataState = (
          metric && typeof metric === "object"
            ? String(metric.data_state || "").toLowerCase()
            : ""
        );
        const annotated = finiteNumber(metric?.annotated_answers);
        const valid = finiteNumber(metric?.valid_answers);
        const denominator = firstFinite(
          valid,
          annotated,
          metric?.completed_answers,
          metric?.expected_answers
        );
        const expected = finiteNumber(metric?.expected_answers);
        const count = finiteNumber(metric?.[countKey]);
        const coverage = finiteNumber(metric?.coverage_rate);
        const observational = isObservationalMemoryMetric(metric);
        const incompleteCoverage = Boolean(
          expected !== null
          && denominator !== null
          && denominator < expected
        );
        if (dataState === "limited" && (!observational || incompleteCoverage)) {
          const secondary = denominator !== null && expected !== null
            ? `${compact ? "В расчёте " : "В расчёте: "}${safeNumber(denominator)} из ${safeNumber(expected)}`
            : "Выборка обработана частично";
          return {
            className: "is-incomplete",
            primary: "Неполные данные",
            secondary,
            aria: `Неполные данные. ${secondary}.`
          };
        }
        if (dataState === "unavailable") {
          if (metric?.unavailable_reason === "target_portfolio_unconfirmed") {
            const secondary = compact
              ? "Портфель не подтверждён сайтом"
              : "Состав предложения не подтверждён данными сайта; ноль не подставляется";
            return {
              className: "is-unavailable",
              primary: "Не рассчитано",
              secondary,
              aria: `Не рассчитано. ${secondary}.`
            };
          }
          return {
            className: "is-unavailable",
            primary: "Нет данных",
            secondary: "Нет размеченных ответов",
            aria: "Нет данных: ответы не размечены."
          };
        }
        const rate = metricRate(metric, rateKeys);
        const primary = formatPercent(rate);
        const parts = [];
        const ariaParts = [];
        if (count !== null && denominator !== null) {
          parts.push(
            compact
              ? `${safeNumber(count)}/${safeNumber(denominator)}`
              : `${countLabel}: ${safeNumber(count)} из ${safeNumber(denominator)}`
          );
          ariaParts.push(
            `${countLabel}: ${safeNumber(count)} из ${safeNumber(denominator)}`
          );
        }
        if (coverage !== null && coverage < 100) {
          parts.push(
            compact
              ? `${formatPercent(coverage, 0)} покрытия`
              : `Покрытие: ${formatPercent(coverage, 0)}`
          );
          ariaParts.push(`Покрытие: ${formatPercent(coverage, 0)}`);
        }
        if (observational) {
          parts.push(compact ? "исторический срез" : "Исторический срез");
          ariaParts.push(observationalMemoryLimitation);
        }
        const secondary = parts.join(compact ? " · " : ". ");
        return {
          className: rate === null
            ? "is-unavailable"
            : observational
            ? "is-observational"
            : "",
          primary,
          secondary,
          aria: `${primary}${ariaParts.length ? `. ${ariaParts.join(". ")}` : ""}.`
        };
      };

      const comparisonMetricCellHTML = (rowLabel, modeLabel, metric, options) => {
        const presentation = metricPresentation(metric, options);
        const accessibleLabel = `${rowLabel}, ${modeLabel}: ${presentation.aria}`;
        return `
          <span
            class="comparison-value ${presentation.className}"
            role="cell"
            title="${escapeHTML(accessibleLabel)}"
            aria-label="${escapeHTML(accessibleLabel)}"
          >
            <strong>${escapeHTML(presentation.primary)}</strong>
            ${presentation.secondary
              ? `<small>${escapeHTML(presentation.secondary)}</small>`
              : ""
            }
          </span>
        `;
      };

      const providerMetricCellHTML = (providerName, metricLabel, metric, options) => {
        const presentation = metricPresentation(metric, { ...options, compact: true });
        const accessibleLabel = `${providerName}, ${metricLabel}: ${presentation.aria}`;
        return `
          <span
            class="matrix-value ${presentation.className}"
            data-label="${escapeHTML(metricLabel)}"
            title="${escapeHTML(accessibleLabel)}"
            aria-label="${escapeHTML(accessibleLabel)}"
          >
            <strong>${escapeHTML(presentation.primary)}</strong>
            ${presentation.secondary
              ? `<small>${escapeHTML(presentation.secondary)}</small>`
              : ""
            }
          </span>
        `;
      };

      const comparisonTableHTML = (rows) => {
        const memoryPresentation = memorySlicePresentation(
          rows.map((row) => row?.memory)
        );
        return `
          <div
            class="comparison-table"
            role="table"
            aria-label="Сопоставление режимов исследования"
          >
            <div class="comparison-row comparison-header" role="row">
              <span role="columnheader">Что измеряем</span>
              <span role="columnheader">С веб-поиском</span>
              <span role="columnheader">${escapeHTML(memoryPresentation.columnLabel)}</span>
            </div>
            ${rows.map((row) => `
              <div class="comparison-row" role="row">
                <span class="comparison-label" role="rowheader">${escapeHTML(row.label)}</span>
                ${comparisonMetricCellHTML(
                  row.label,
                  "с веб-поиском",
                  row.web,
                  row.options
                )}
                ${comparisonMetricCellHTML(
                  row.label,
                  memoryPresentation.modeLabel,
                  row.memory,
                  row.options
                )}
              </div>
            `).join("")}
          </div>
          ${memoryPresentation.observational ? `
            <p class="comparison-observation-note">
              ${escapeHTML(memoryPresentation.caveat)}
            </p>
          ` : ""}
        `;
      };

      const metricEvidenceText = (
        metric,
        {
          rateKeys = ["mention_rate"],
          countKey = "mention_count",
          countLabel = "попаданий"
        } = {}
      ) => {
        if (!metric || typeof metric !== "object") return "Не измерялось";
        const dataState = String(metric.data_state || "").toLowerCase();
        if (dataState === "unavailable") return "Не измерялось";
        const observational = isObservationalMemoryMetric(metric);
        const denominator = firstFinite(
          metric.valid_answers,
          metric.annotated_answers,
          metric.completed_answers,
          metric.expected_answers
        );
        const expected = finiteNumber(metric.expected_answers);
        if (
          dataState === "limited"
          && (
            !observational
            || (
              denominator !== null
              && expected !== null
              && denominator < expected
            )
          )
        ) {
          const annotated = finiteNumber(metric.annotated_answers);
          return annotated !== null && expected !== null
            ? `Неполные данные · ${safeNumber(annotated)} из ${safeNumber(expected)} ответов`
            : "Неполные данные";
        }
        const rate = metricRate(metric, rateKeys);
        if (rate === null) return "Не измерялось";
        const count = finiteNumber(metric[countKey]);
        const value = count !== null && denominator !== null
          ? `${formatPercent(rate)} · ${safeNumber(count)} из ${safeNumber(denominator)} ${countLabel}`
          : formatPercent(rate);
        return observational ? `${value} · исторический срез` : value;
      };

      const simpleDataTableHTML = (headers, rows, ariaLabel, className = "") => `
        <div class="data-table-wrap">
          <table class="data-table ${escapeHTML(className)}" aria-label="${escapeHTML(ariaLabel)}">
            <thead>
              <tr>${headers.map((header) => `<th scope="col">${escapeHTML(header)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  ${row.map((cell, index) => {
                    const value = (
                      cell && typeof cell === "object"
                        ? cell
                        : { primary: cell }
                    );
                    return `
                      <td data-label="${escapeHTML(headers[index] || "")}">
                        <strong>${escapeHTML(value.primary ?? "Не измерялось")}</strong>
                        ${value.secondary ? `<small>${escapeHTML(value.secondary)}</small>` : ""}
                      </td>
                    `;
                  }).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;

      const chartDataDetailsHTML = (summary, tableHTML) => `
        <details class="chart-data">
          <summary>${escapeHTML(summary)}</summary>
          ${tableHTML}
        </details>
      `;

      const relationshipLabel = (relationship) => ({
        parent: "материнский бренд",
        portfolio: "продукт или бизнес группы",
        competitor: "альтернатива",
        target: "целевой бренд"
      }[String(relationship || "").toLowerCase()] || "участник рынка");

      const reportCompetitorRows = (viewModel) => {
        const rows = viewModel.competitors.map((row) => ({ ...row }));
        const normalizedBrand = String(viewModel.brandName)
          .trim()
          .toLocaleLowerCase("ru-RU");
        if (!rows.some((row) => (
          row?.relationship === "parent"
          || String(row?.name || "").trim().toLocaleLowerCase("ru-RU") === normalizedBrand
        ))) {
          const mentionRate = metricRate(viewModel.parent?.web, ["mention_rate"]);
          rows.unshift({
            name: viewModel.brandName,
            mention_count: finiteNumber(viewModel.parent?.web?.mention_count),
            total_answers: firstFinite(
              viewModel.parent?.web?.valid_answers,
              viewModel.parent?.web?.annotated_answers
            ),
            mention_share: mentionRate,
            is_target: true,
            relationship: "parent"
          });
        }
        return rows
          .filter((row) => String(row?.name || "").trim())
          .sort((left, right) => {
            if (left?.relationship === "parent" && right?.relationship !== "parent") return -1;
            if (right?.relationship === "parent" && left?.relationship !== "parent") return 1;
            return (finiteNumber(right?.mention_share) || 0) - (finiteNumber(left?.mention_share) || 0);
          });
      };

      const competitorChartDataTableHTML = (rows) => simpleDataTableHTML(
        ["Бренд или компания", "Доля валидных ответов", "Попадания", "Роль"],
        rows.map((row) => [
          row?.name || "Без названия",
          finiteNumber(row?.mention_share) === null
            ? "Не измерялось"
            : formatPercent(row.mention_share),
          finiteNumber(row?.mention_count) !== null
            && finiteNumber(row?.total_answers) !== null
            ? `${safeNumber(row.mention_count)} из ${safeNumber(row.total_answers)}`
            : "Не измерялись",
          relationshipLabel(row?.relationship)
        ]),
        "Упоминания в валидных безбрендовых ответах с веб-поиском"
      );

      const competitorAnswerBase = (viewModel, rows) => firstFinite(
        ...(Array.isArray(rows) ? rows : []).map((row) => row?.total_answers),
        viewModel.parent?.web?.valid_answers,
        viewModel.parent?.web?.annotated_answers
      );

      const competitorChartLayout = (viewportWidth, rowCount) => {
        const compact = viewportWidth <= 700;
        const count = Math.max(1, Math.floor(finiteNumber(rowCount) || 1));
        return {
          compact,
          height: Math.max(
            compact ? 280 : 320,
            count * (compact ? 40 : 36) + (compact ? 68 : 78)
          ),
          axisLabel: {
            width: compact ? 104 : 190,
            overflow: "truncate",
            ellipsis: "…",
            interval: 0,
            hideOverlap: false,
            lineHeight: compact ? 13 : 14,
            color: "#101011",
            fontSize: compact ? 10 : 11,
            fontWeight: 600
          }
        };
      };

      const competitorChartExplainerHTML = (viewModel, rows) => {
        const denominator = competitorAnswerBase(viewModel, rows);
        const base = denominator === null
          ? "Все полученные валидные ответы"
          : `${safeNumber(denominator)} валидных ответов`;
        return `
          <dl class="entity-chart-explainer" aria-label="Как читать диаграмму упоминаний">
            <div>
              <dt>Запросы</dt>
              <dd>
                Пользовательские задачи без названия

            </div>
            <div>
              <dt>Режим</dt>
              <dd>
                Ответы из режима с веб-поиском. Незавершённые и невалидные

              </dd>
            </div>
            <div>
              <dt>Расчёт</dt>
              <dd>
                ${escapeHTML(base)}: доля, где сущность встретилась хотя бы один раз.

            </div>
          </dl>

      const pairedRows = (viewModel) => {

        if (paired?.parent || paired?.portfolio) {

                web: paired.portfolio?.web,
                memory: paired.portfolio?.memory,
                observedDifference: paired.portfolio?.observed_difference,
                observedDifferenceMetric:
                  paired.portfolio?.observed_difference_metric
              }] : [])
            ]
          };
        }
          return {
            nPairs: null,
            dataState: "unavailable",
            limitationReason: "",
            causalInterpretationAllowed: false,
            rows: [
            {
              label: "Материнский бренд",
              description: "Как часто ИИ сам называет исследуемый бренд, если его имени не было в вопросе.",
              web: viewModel.parent?.web,
              memory: viewModel.parent?.memory
            },
            ...(!portfolioUnavailable ? [{
              label: "Продукты и направления",
              description: "Как часто ИИ сам называет продукты, услуги или направления исследуемой группы.",
              web: viewModel.portfolio?.web,
              memory: viewModel.portfolio?.memory
            }] : [])
          ]
        };
      };

      const pairedComparisonTableHTML = (paired) => {
        const pairCount = finiteNumber(paired?.nPairs);
        const hasMatchedPairs = pairCount !== null && pairCount > 0;
        const memoryPresentation = memorySlicePresentation(
          (paired?.rows || []).map((row) => row?.memory)
        );
        const observational = memoryPresentation.observational;
        const causalAllowed = paired?.causalInterpretationAllowed === true;
        const context = hasMatchedPairs && observational
          ? (
              "Сопоставлены одинаковые запросы и ИИ-системы. Разница ниже "
              + "описательная: "
              + memoryPresentation.caveat
            )
          : hasMatchedPairs
          ? (
              "Каждый запрос сопоставлен с той же ИИ-системой в двух режимах. "
              + (
                causalAllowed
                  ? "Показана разница долей упоминаний."
                  : "Показана наблюдаемая разница долей, а не доказанный причинный эффект."
              )
            )
          : pairCount === 0
          ? "Подтверждённых пар для сопоставления режимов нет, поэтому разница не рассчитывается."
          : "Срезы собраны на разных выборках. Значения можно читать отдельно, но прямую разницу между ними считать некорректно.";
        const rows = paired.rows.map((row) => {
          const web = metricPresentation(row.web, {
            rateKeys: ["mention_rate"],
            countKey: "mention_count",
            countLabel: "Попаданий"
          });
          const memory = metricPresentation(row.memory, {
            rateKeys: ["mention_rate"],
            countKey: "mention_count",
            countLabel: "Попаданий"
          });
          const difference = (
            hasMatchedPairs
            && row.observedDifferenceMetric
              === "mention_rate_percentage_points"
              ? finiteNumber(row.observedDifference)
              : null
          );
          const differenceClass = difference === null
            ? "is-unavailable"
            : difference > 0.05
            ? "is-positive"
            : difference < -0.05
            ? "is-negative"
            : "is-neutral";
          const differenceLabel = difference === null
            ? "Не сравниваем"
            : `${difference > 0 ? "+" : ""}${safeNumber(difference, 1)} п.п.`;
          const portfolioScopeUnavailable = [row.web, row.memory].some((metric) => (
            metric?.unavailable_reason === "target_portfolio_unconfirmed"
          ));
          const differenceMeaning = portfolioScopeUnavailable
            ? "Состав предложения не подтверждён данными сайта; продуктовый показатель не рассчитан."
            : difference === null
            ? "Сервер не подтвердил сопоставимую разницу для этой строки."
            : difference > 0.05
            ? "В сопоставленных ответах доля упоминаний с веб-поиском была выше."
            : difference < -0.05
            ? "В историческом срезе доля упоминаний была выше."
            : "В сопоставленных ответах доли упоминаний совпали.";
          return `
            <tr>
              <th class="paired-metric" scope="row" data-label="Что ищем">
                <strong>${escapeHTML(row.label)}</strong>
                <small>${escapeHTML(row.description || "")}</small>
              </th>
              <td class="paired-value ${web.className}" data-label="С веб-поиском">
                <strong>${escapeHTML(web.primary)}</strong>
                ${web.secondary ? `<small>${escapeHTML(web.secondary)}</small>` : ""}
              </td>
              <td class="paired-value ${memory.className}" data-label="${escapeHTML(memoryPresentation.columnLabel)}">
                <strong>${escapeHTML(memory.primary)}</strong>
                ${memory.secondary ? `<small>${escapeHTML(memory.secondary)}</small>` : ""}
              </td>
              <td class="paired-delta" data-label="Наблюдаемая разница">
                <span class="paired-delta-pill ${differenceClass}">${escapeHTML(differenceLabel)}</span>
                <small>${escapeHTML(differenceMeaning)}</small>
              </td>
            </tr>
          `;
        }).join("");
        return `
          <div class="paired-comparison">
            <p class="paired-context">${escapeHTML(context)}</p>
            <div class="data-table-wrap">
              <table class="data-table paired-comparison-table" aria-label="Сопоставление результатов двух режимов исследования">
                <thead>
                  <tr>
                    <th scope="col">Что ищем в ответах</th>
                    <th scope="col">С веб-поиском</th>
                    <th scope="col">${escapeHTML(memoryPresentation.columnLabel)}</th>
                    <th scope="col">Наблюдаемая разница</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      };

      const orderedIntentRows = (intents) => {
        const byCode = new Map(
          (Array.isArray(intents) ? intents : [])
            .map((intent) => [String(intent?.intent || ""), intent])
        );
        return ["I", "E", "T", "NB", "NAV", "TR"].map((code) => (
          byCode.get(code) || { intent: code, parent: null, portfolio: null }
        ));
      };

      const intentMetricPresentation = (metric) => {
        if (!metric || typeof metric !== "object") {
          return {
            indexValue: null,
            countLabel: "Не измерялось",
            primary: "Не измерялось",
            secondary: "Ответы для этого сценария не получены"
          };
        }
        if (
          String(metric.data_state || "").toLowerCase() === "unavailable"
          && metric.unavailable_reason === "target_portfolio_unconfirmed"
        ) {
          return {
            indexValue: null,
            countLabel: "Не рассчитано",
            primary: "Не рассчитано",
            secondary: "Состав предложения не подтверждён данными сайта"
          };
        }
        const indexValue = metricRate(metric, ["score"]);
        const mentions = finiteNumber(metric.mention_count);
        const top3 = finiteNumber(metric.top3_count);
        const recommendations = finiteNumber(metric.recommendation_count);
        const denominator = firstFinite(
          metric.valid_answers,
          metric.annotated_answers,
          metric.completed_answers,
          metric.expected_answers
        );
        const mentionedEntities = (
          Array.isArray(metric.mentioned_entities)
            ? metric.mentioned_entities
                .filter((entity) => (
                  entity?.name && finiteNumber(entity?.answer_count) !== null
                ))
                .slice(0, 3)
            : []
        );
        if (indexValue === null || denominator === null) {
          return {
            indexValue: null,
            countLabel: "Не измерялось",
            primary: "Не измерялось",
            secondary: "Недостаточно обработанных ответов"
          };
        }
        const countLabel = `${safeNumber(mentions || 0)} из ${safeNumber(denominator)}`;
        const entityEvidence = mentionedEntities
          .map((entity) => (
            `${entity.name}: ${safeNumber(entity.answer_count)} из ${safeNumber(denominator)}`
          ))
          .join(", ");
        const secondary = mentions === 0
          ? `Цель не названа ни в одном из ${safeNumber(denominator)} ответов`
          : [
              entityEvidence,
              `Упоминание: ${countLabel}`,
              top3 === null ? "" : `топ-3: ${safeNumber(top3)} из ${safeNumber(denominator)}`,
              recommendations === null
                ? ""
                : `рекомендация: ${safeNumber(recommendations)} из ${safeNumber(denominator)}`
            ].filter(Boolean).join(" · ");
        return {
          indexValue,
          countLabel,
          primary: `Индекс ${safeNumber(indexValue, indexValue % 1 ? 1 : 0)}/100`,
          secondary
        };
      };

      const intentChartDataTableHTML = (
        intents,
        methodology = {},
        { includePortfolio = true } = {}
      ) => simpleDataTableHTML(
        [
          "Сценарий",
          "Индекс бренда /100",
          ...(includePortfolio ? ["Индекс продуктов /100"] : [])
        ],
        orderedIntentRows(intents).map((intent) => [
          {
            primary: intentName(intent.intent, methodology),
            secondary: intent.intent
          },
          intentMetricPresentation(intent.parent),
          ...(includePortfolio
            ? [intentMetricPresentation(intent.portfolio)]
            : [])
        ]),
        "INTENT-сценарии с веб-поиском: один ответ каждой ИИ-системы на сценарий"
      );

      const disposeReportCharts = () => {
        if (reportChartObserver) {
          reportChartObserver.disconnect();
          reportChartObserver = null;
        }
        while (reportChartDisposers.length) {
          const dispose = reportChartDisposers.pop();
          try {
            dispose();
          } catch (_error) {
            // A detached responsive listener is already harmless.
          }
        }
        while (reportCharts.length) {
          const chart = reportCharts.pop();
          try {
            chart.dispose();
          } catch (_error) {
            // A detached chart is already harmless.
          }
        }
      };

      const mountReportChart = (elementId, option) => {
        const element = document.getElementById(elementId);
        if (!element) return null;
        if (!window.echarts) {
          element.setAttribute("aria-busy", "false");
          element.classList.add("chart-load-error");
          return null;
        }
        try {
          const chart = window.echarts.init(element, null, { renderer: "svg" });
          chart.setOption(option);
          element.setAttribute("aria-busy", "false");
          reportCharts.push(chart);
          if (!reportChartObserver && "ResizeObserver" in window) {
            reportChartObserver = new ResizeObserver((entries) => {
              entries.forEach((entry) => {
                reportCharts
                  .filter((item) => item.getDom() === entry.target)
                  .forEach((item) => item.resize());
              });
            });
          }
          reportChartObserver?.observe(element);
          return chart;
        } catch (_error) {
          element.setAttribute("aria-busy", "false");
          element.classList.add("chart-load-error");
          return null;
        }
      };

      const reportChartBase = (description) => ({
        animation: !window.matchMedia("(prefers-reduced-motion: reduce)").matches,
        animationDuration: 520,
        animationEasing: "cubicOut",
        textStyle: {
          color: "#101011",
          fontFamily: "Manrope, system-ui, sans-serif"
        },
        aria: {
          enabled: true,
          decal: { show: false },
          description
        }
      });

      const percentValueAxis = (max = 100) => ({
        type: "value",
        min: 0,
        max,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: {
          color: "#687788",
          fontSize: 11,
          formatter: "{value}%"
        },
        splitLine: {
          lineStyle: {
            color: "rgba(16,16,17,0.11)",
            type: "dashed"
          }
        }
      });

      const chartTooltip = {
        backgroundColor: "#101011",
        borderWidth: 0,
        borderRadius: 10,
        padding: [10, 12],
        confine: true,
        textStyle: {
          color: "#ffffff",
          fontFamily: "Manrope, system-ui, sans-serif",
          fontSize: 12
        },
        extraCssText: "box-shadow:0 12px 32px rgba(16,16,17,.18)"
      };

      const providerChartVisuals = [
        {
          pattern: /openai|chatgpt|\bgpt\b/i,
          color: "#0080f7",
          labelColor: "#0069c9",
          tint: "#e1f1ff",
          icon: "/static/brand/providers/openai.svg"
        },
        {
          pattern: /anthropic|claude/i,
          color: "#d97757",
          labelColor: "#a94e32",
          tint: "#f8e5dd",
          icon: "/static/brand/providers/anthropic.svg"
        },
        {
          pattern: /perplexity/i,
          color: "#1fb8cd",
          labelColor: "#087985",
          tint: "#ddf6f9",
          icon: "/static/brand/providers/perplexity.svg"
        },
        {
          pattern: /google|gemini/i,
          color: "#8e75b2",
          labelColor: "#6c518f",
          tint: "#efeaf6",
          icon: "/static/brand/providers/gemini.svg"
        },
        {
          pattern: /deepseek/i,
          color: "#4d6bfe",
          labelColor: "#3550d8",
          tint: "#e5eaff",
          icon: "/static/brand/providers/deepseek.svg"
        }
      ];

      const providerFallbackColors = [
        { color: "#ff324b", labelColor: "#d81f39", tint: "#ffe5e9" },
        { color: "#00a878", labelColor: "#007d59", tint: "#ddf7ef" },
        { color: "#f59f00", labelColor: "#9b6500", tint: "#fff0cf" },
        { color: "#6f7d8c", labelColor: "#465463", tint: "#e8edf2" }
      ];

      const providerChartVisual = (name, index) => {
        const label = String(name || "").trim();
        const known = providerChartVisuals.find((item) => item.pattern.test(label));
        if (known) return known;
        const fallback = providerFallbackColors[index % providerFallbackColors.length];
        const words = label.split(/\s+/).filter(Boolean);
        const monogram = (
          words.length > 1
            ? words.slice(0, 2).map((word) => word[0]).join("")
            : label.slice(0, 2)
        ).toLocaleUpperCase("ru-RU") || "AI";
        return { ...fallback, monogram };
      };

      const providerMetricDefinitions = [
        {
          key: "parent",
          label: "Бренд без подсказки",
          color: "#ff324b",
          rateKeys: ["mention_rate"],
          countKey: "mention_count",
          countLabel: "упоминаний",
          description: (
            "Система сама назвала исследуемый бренд в безбрендовом запросе "
            + "с веб-поиском."
          ),
          signals: [
            { key: "top3_count", label: "В топ‑3" },
            { key: "recommendation_count", label: "Рекомендует" }
          ]
        },
        {
          key: "portfolio",
          label: "Продукты без подсказки",
          color: "#4d6bfe",
          rateKeys: ["mention_rate"],
          countKey: "mention_count",
          countLabel: "попаданий",
          description: (
            "Система сама связала исследуемый бренд с подтверждённым продуктом, "
            + "услугой или направлением в безбрендовом запросе с веб-поиском."
          ),
          signals: [
            { key: "top3_count", label: "В топ‑3" },
            { key: "recommendation_count", label: "Рекомендует" }
          ]
        },
        {
          key: "knowledge",
          label: "Конкретность ответа",
          color: "#00a878",
          rateKeys: ["specific_rate", "answer_rate"],
          countKey: "specific_count",
          countLabel: "конкретных ответов",
          description: (
            "Система дала конкретные сведения о прямо названном бренде."
          ),
          signals: [
            { key: "contradiction_count", label: "Противоречия" }
          ]
        }
      ];

      const providerKnowledgeMetric = (provider) => (
        provider?.knowledgeMemory ?? null
      );

      const providerMetricForDefinition = (
        provider,
        definition,
        options = {}
      ) => (
        definition.key === "knowledge"
          ? providerKnowledgeMetric(provider, options)
          : provider?.[definition.key]
      );

      const providerMetricDenominator = (metric) => {
        if (!metric || typeof metric !== "object") return null;
        return firstFinite(
          metric.valid_answers,
          metric.annotated_answers,
          metric.completed_answers,
          metric.expected_answers
        );
      };

      const providerMetricBaseSummary = (
        providers,
        definitions,
        options = {}
      ) => {
        const bases = [
          ...new Set(
            (Array.isArray(providers) ? providers : [])
              .flatMap((provider) => definitions.map((definition) => (
                providerMetricDenominator(
                  providerMetricForDefinition(provider, definition, options)
                )
              )))
              .filter((value) => value !== null && value > 0)
          )
        ].sort((left, right) => left - right);
        if (!bases.length) return "валидных ответов пока нет";
        if (bases.length === 1) {
          return `по ${pluralizeValidAnswers(bases[0], { afterPo: true })} на систему`;
        }
        return (
          `${safeNumber(bases[0])}–${safeNumber(bases[bases.length - 1])} `
          + "валидных ответов на систему"
        );
      };

      const providerIdentityHTML = (name, index) => {
        const visual = providerChartVisual(name, index);
        const mark = visual.icon
          ? `
            <img
              src="${escapeHTML(visual.icon)}"
              width="24"
              height="24"
              alt=""
              aria-hidden="true"
              loading="lazy"
              decoding="async"
            >
          `
          : escapeHTML(visual.monogram || "AI");
        return `
          <span
            class="provider-identity"
            style="
              --provider-color:${escapeHTML(visual.color)};
              --provider-label-color:${escapeHTML(visual.labelColor)};
              --provider-tint:${escapeHTML(visual.tint)};
            "
          >
            <span class="provider-identity-mark" aria-hidden="true">${mark}</span>
            <span class="provider-identity-name">${escapeHTML(name)}</span>
          </span>
        `;
      };

      const familyAccessStatus = (family = {}) => {
        const rawState = String(family?.state || "").toLowerCase();
        const rate = finiteNumber(family?.access_rate);
        const passed = Math.max(0, Math.round(finiteNumber(family?.passed_count) || 0));
        const known = Math.max(0, Math.round(finiteNumber(family?.total_count) || 0));
        const unknown = Math.max(0, Math.round(finiteNumber(family?.unknown_count) || 0));
        const expected = Math.max(
          known + unknown,
          Math.round(finiteNumber(family?.expected_count) || 0)
        );
        const blocked = Math.max(0, known - passed);
        let key = "unknown";
        if (
          rawState === "available"
          || (known > 0 && passed === known && unknown === 0)
          || (rawState === "" && rate === 100)
        ) {
          key = "available";
        } else if (
          rawState === "blocked"
          || (known > 0 && passed === 0 && unknown === 0)
          || (rawState === "" && rate === 0)
        ) {
          key = "blocked";
        } else if (
          rawState === "partial"
          || known > 0
          || unknown > 0
          || (rate !== null && rate > 0 && rate < 100)
        ) {
          key = "partial";
        }

        const base = expected || known;
        if (key === "available") {
          return {
            key,
            label: "Доступ открыт",
            detail: base ? `${safeNumber(passed)} из ${safeNumber(base)} проверок` : "Доступ подтверждён",
            explanation: base
              ? `Все ${safeNumber(base)} проверок подтвердили доступ к страницам`
              : "Доступ к страницам подтверждён",
            tooltip: base
              ? (
                  `Сайт ответил этому семейству краулеров во\u00a0всех `
                  + `${safeNumber(base)} проверках. Индикатор показывает `
                  + "возможность открыть страницы, но не\u00a0качество их содержания."
                )
              : (
                  "Сайт ответил этому семейству краулеров. Индикатор показывает "
                  + "возможность открыть страницы, но не\u00a0качество их содержания."
                )
          };
        }
        if (key === "blocked") {
          return {
            key,
            label: "Доступ закрыт",
            detail: base ? `0 из ${safeNumber(base)} проверок` : "Доступ закрыт",
            explanation: base
              ? `Ни одна из ${safeNumber(base)} проверок не подтвердила доступ к страницам`
              : "Доступ к страницам не подтверждён",
            tooltip: base
              ? (
                  `Сайт не\u00a0отдал страницы этому семейству краулеров `
                  + `ни\u00a0в\u00a0одной из\u00a0${safeNumber(base)} проверок. `
                  + "Причину блокировки можно уточнить в\u00a0таблице по\u00a0страницам."
                )
              : (
                  "Доступ к\u00a0страницам не\u00a0подтверждён. Причину можно "
                  + "уточнить в\u00a0таблице по\u00a0страницам."
                )
          };
        }
        if (key === "partial") {
          const detailParts = [
            passed ? `${safeNumber(passed)} доступны` : "",
            blocked ? `${safeNumber(blocked)} закрыты` : "",
            unknown ? `${safeNumber(unknown)} без результата` : ""
          ].filter(Boolean);
          return {
            key,
            label: "Не подтверждён",
            detail: detailParts.join(" · ") || "Результаты различаются",
            explanation: "Часть проверок дала другой или неопределённый результат",
            tooltip: (
              `Проверки дали разные результаты: ${detailParts.join(" · ") || "часть ответов не получена"}. `
              + "До\u00a0перепроверки доступ не\u00a0считается подтверждённым."
            )
          };
        }
        return {
          key,
          label: "Не проверен",
          detail: "Нет надёжного результата",
          explanation: "Проверка доступа не завершилась с определённым результатом",
          tooltip: (
            "Проверка не\u00a0дала надёжного результата. До\u00a0перепроверки "
            + "доступ считается неподтверждённым."
          )
        };
      };

      const familyStatusPanelHTML = (families, domain = "") => {
        const rows = (Array.isArray(families) ? families : []).map((family, index) => ({
          family,
          index,
          name: String(family?.name || "ИИ-система").trim(),
          visual: providerChartVisual(family?.name || "", index),
          status: familyAccessStatus(family)
        }));
        if (!rows.length) {
          return `<p class="family-status-empty">Данные о доступе ИИ-краулеров пока не получены</p>`;
        }
        const available = rows.filter((row) => row.status.key === "available").length;
        const blocked = rows.filter((row) => row.status.key === "blocked").length;
        const partial = rows.filter((row) => row.status.key === "partial").length;
        const unknown = rows.filter((row) => row.status.key === "unknown").length;
        const summary = available === rows.length
          ? `Доступ открыт для ${safeNumber(available)} из ${safeNumber(rows.length)} систем`
          : [
              `Открыт для ${safeNumber(available)}`,
              blocked ? `закрыт для ${safeNumber(blocked)}` : "",
              partial ? `не подтверждён для ${safeNumber(partial)}` : "",
              unknown ? `не проверен для ${safeNumber(unknown)}` : ""
            ].filter(Boolean).join(" · ");
        return `
          <div
            class="family-status-panel"
            aria-label="Доступ сайта ${escapeHTML(domain)} для семейств ИИ-краулеров"
          >
            <div class="family-status-overview">
              <p class="family-status-summary">${escapeHTML(summary)}</p>
              <span class="family-status-legend">Лампа горит — доступ открыт</span>
            </div>
            <div class="family-status-grid" role="list">
              ${rows.map((row) => `
                <article
                  class="family-status-card is-${escapeHTML(row.status.key)}"
                  role="listitem"
                  tabindex="0"
                  aria-label="${escapeHTML(`${row.name}: ${row.status.label}. ${row.status.explanation}`)}"
                  style="--provider-color:${escapeHTML(row.visual.color)}"
                >
                  ${providerIdentityHTML(row.name, row.index)}
                  <span class="family-status-lamp" aria-hidden="true">
                    <span class="family-status-lamp-bezel"></span>
                    <span class="family-status-lamp-glass"></span>
                    <span class="family-status-lamp-filament"></span>
                  </span>
                  <strong class="family-status-state">${escapeHTML(row.status.label)}</strong>
                  ${auditTooltipHTML({
                    id: `family-${safeNumber(row.index)}-access-help`,
                    visibleHTML: (
                      `<span class="family-status-detail">${escapeHTML(row.status.detail)}</span>`
                    ),
                    title: `${row.name}: ${row.status.label}`,
                    copy: row.status.tooltip,
                    controlLabel: `Как проверен доступ для ${row.name}`,
                    modifier: "family-status-tooltip"
                  })}
                </article>
              `).join("")}
            </div>
          </div>
        `;
      };

      const providerMetricCellHTMLV2 = ({
        providerName,
        providerIndex,
        metric,
        definition,
      }) => {
        const dataState = String(metric?.data_state || "").toLowerCase();
        const rate = metricRate(metric, definition.rateKeys);
        const denominator = providerMetricDenominator(metric);
        const count = finiteNumber(metric?.[definition.countKey]);
        const expected = finiteNumber(metric?.expected_answers);
        const observational = isObservationalMemoryMetric(metric);
        const unavailable = (
          !metric
          || dataState === "unavailable"
          || rate === null
          || denominator === null
          || denominator <= 0
        );
        const boundedRate = unavailable
          ? 0
          : Math.max(0, Math.min(100, rate));
        const rateLabel = unavailable ? "Не измерялось" : formatPercent(rate);
        const fractionLabel = (
          !unavailable && count !== null
            ? `${safeNumber(count)} из ${safeNumber(denominator)}`
            : ""
        );
        const signals = unavailable
          ? []
          : definition.signals.map((signal) => {
              const signalCount = finiteNumber(metric?.[signal.key]);
              return {
                ...signal,
                text: (
                  signalCount !== null
                    ? `${safeNumber(signalCount)} из ${safeNumber(denominator)}`
                    : "не измерялось"
                )
              };
            });
        const incompleteCoverage = !unavailable && (
          expected !== null
          && denominator !== null
          && denominator < expected
        );
        const limited = !unavailable && (
          dataState === "limited" || incompleteCoverage
        );
        const coverageLabel = incompleteCoverage && expected !== null
          ? `Неполная база: ${safeNumber(denominator)} из ${safeNumber(expected)}`
          : observational
          ? "Исторический срез"
          : "";
        const signalCopy = signals.length
          ? `. ${signals.map((signal) => (
              `${signal.label}: ${signal.text}`
            )).join("; ")}`
          : "";
        const calculationCopy = unavailable
          ? (
              metric?.unavailable_reason === "target_portfolio_unconfirmed"
                ? "Сайт не дал достаточно данных, чтобы подтвердить состав предложения. Продуктовый показатель не рассчитан, и ноль не подставляется."
                : "Для этого среза нет валидных ответов, поэтому ноль не подставляется."
            )
          : (
            `${definition.description} Результат: `
            + (
              count !== null
                ? `${safeNumber(count)} из ${safeNumber(denominator)}`
                : rateLabel
            )
            + `${signalCopy}.`
          );
        const knowledgeCaveat = definition.key === "knowledge" && !unavailable
          ? (
              " Показатель отражает конкретность ответа, а не долю независимо "
              + "проверенных моделью фактов."
            )
          : "";
        const observationalCaveat = observational
          ? ` ${observationalMemoryLimitation}`
          : "";
        const coverageCopy = coverageLabel ? ` ${coverageLabel}.` : "";
        const tooltipId = (
          `provider-${safeNumber(providerIndex)}-${definition.key}-tooltip`
        );
        const visibleHTML = `
          <span class="provider-metric-primary">
            <span class="provider-metric-rate">${escapeHTML(rateLabel)}</span>
            ${fractionLabel
              ? `<span class="provider-metric-fraction">${escapeHTML(fractionLabel)}</span>`
              : ""
            }
          </span>
          <span class="provider-metric-track" aria-hidden="true">
            <span class="provider-metric-fill"></span>
          </span>
          ${signals.length ? `
            <span class="provider-metric-signals">
              ${signals.map((signal) => `
                <span>
                  ${escapeHTML(signal.label)}:
                  <strong>${escapeHTML(signal.text)}</strong>
                </span>
              `).join("")}
            </span>
          ` : ""}
          ${coverageLabel
            ? `<span class="provider-metric-coverage">${escapeHTML(coverageLabel)}</span>`
            : ""
          }
        `;
        const accessibleLabel = [
          providerName,
          definition.label,
          rateLabel,
          fractionLabel,
          ...signals.map((signal) => `${signal.label}: ${signal.text}`),
          coverageLabel,
          observational ? observationalMemoryLimitation : ""
        ].filter(Boolean).join(". ");
        return `
          <td
            class="provider-comparison-metric${unavailable ? " is-unavailable" : ""}${limited ? " is-limited" : ""}"
            data-label="${escapeHTML(definition.label)}"
            aria-label="${escapeHTML(accessibleLabel)}"
            style="
              --provider-metric-color:${escapeHTML(definition.color)};
              --provider-rate:${Math.round(boundedRate * 10) / 10}%;
            "
          >
            ${auditTooltipHTML({
              id: tooltipId,
              visibleHTML,
              title: `${providerName}: ${definition.label}`,
              copy: `${calculationCopy}${knowledgeCaveat}${observationalCaveat}${coverageCopy}`,
              controlLabel: `Как рассчитан показатель «${definition.label}» у ${providerName}`,
              modifier: "provider-metric-tooltip"
            })}
          </td>
        `;
      };

      const providerComparisonMatrixHTML = (
        providers,
        {
          portfolioUnavailable = false
        } = {}
      ) => {
        const rows = Array.isArray(providers) ? providers : [];
        const discoveryDefinitions = providerMetricDefinitions.slice(
          0,
          portfolioUnavailable ? 1 : 2
        );
        const knowledgeDefinition = providerMetricDefinitions[2];
        const metricOptions = {};
        const knowledgePresentation = memorySlicePresentation(
          rows.map((provider) => providerKnowledgeMetric(provider))
        );
        const discoveryBase = providerMetricBaseSummary(
          rows,
          discoveryDefinitions,
          metricOptions
        );
        const knowledgeBase = providerMetricBaseSummary(
          rows,
          [knowledgeDefinition],
          metricOptions
        );
        return `
          <div class="provider-comparison" data-provider-comparison>
            <table
              class="provider-comparison-table"
              aria-label="Сравнение результатов ИИ-систем"
            >
              <caption>Доля валидных ответов, соответствующих критерию</caption>
              <colgroup>
                <col style="width:20%">
              </colgroup>
              ${[...discoveryDefinitions, knowledgeDefinition].map(() => `
                <colgroup>
                  <col style="width:${80 / (discoveryDefinitions.length + 1)}%">
                </colgroup>
              `).join("")}
              <thead>
                <tr>
                  <th class="provider-comparison-corner" rowspan="2" scope="col">
                    ИИ-система
                  </th>
                  <th
                    class="provider-comparison-group"
                    colspan="${discoveryDefinitions.length}"
                    scope="colgroup"
                    style="--provider-group-color:#ff324b"
                  >
                    <strong>Безбрендовые запросы · с веб-поиском</strong>
                    <small>${escapeHTML(discoveryBase)}</small>
                  </th>
                  <th
                    class="provider-comparison-group"
                    scope="colgroup"
                    style="--provider-group-color:#00a878"
                  >
                    <strong>Бренд назван · ${escapeHTML(knowledgePresentation.columnLabel.toLowerCase())}</strong>
                    <small>${escapeHTML(knowledgeBase)}</small>
                  </th>
                </tr>
                <tr>
                  ${discoveryDefinitions.map((definition) => `
                    <th class="provider-comparison-column" scope="col">
                      ${auditHeaderTooltipHTML(
                        `provider-${definition.key}-metric-help`,
                        definition.label,
                        definition.description
                      )}
                    </th>
                  `).join("")}
                  <th class="provider-comparison-column" scope="col">
                    ${auditHeaderTooltipHTML(
                      "provider-knowledge-metric-help",
                      "Конкретность ответа",
                      (
                        "В скольких ответах система дала конкретные сведения "
                        + "о прямо названном бренде. "
                        + (knowledgePresentation.caveat || "Режим без веб-поиска технически подтверждён.")
                      )
                    )}
                  </th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows.map((provider, providerIndex) => {
                  const knowledgeMetric = providerKnowledgeMetric(provider);
                  return `
                    <tr>
                      <th
                        class="provider-comparison-provider"
                        scope="row"
                        data-label="ИИ-система"
                      >
                        ${providerIdentityHTML(provider.name, providerIndex)}
                      </th>
                      ${discoveryDefinitions.map((definition) => (
                        providerMetricCellHTMLV2({
                          providerName: provider.name,
                          providerIndex,
                          metric: provider?.[definition.key],
                          definition
                        })
                      )).join("")}
                      ${providerMetricCellHTMLV2({
                        providerName: provider.name,
                        providerIndex,
                        metric: knowledgeMetric,
                        definition: knowledgeDefinition
                      })}
                    </tr>
                  `;
                }).join("") : `
                  <tr>
                    <th class="provider-comparison-provider" scope="row">
                      Недостаточно данных
                    </th>
                    <td class="provider-comparison-metric is-unavailable" colspan="${discoveryDefinitions.length + 1}">
                      Валидные ответы ИИ-систем пока не получены.
                    </td>
                  </tr>
                `}
              </tbody>
            </table>
          </div>
        `;
      };

      const initReportCharts = (viewModel) => {
        const competitors = reportCompetitorRows(viewModel);
        if (competitors.length) {
          const competitorChartMedia = window.matchMedia(
            "(max-width: 700px)"
          );
          const competitorChartElement = document.getElementById(
            "chart-competitors"
          );
          const currentCompetitorChartLayout = () => competitorChartLayout(
            window.innerWidth,
            competitors.length
          );
          const syncCompetitorChartHeight = (layout) => {
            if (!competitorChartElement) return;
            const height = `${layout.height}px`;
            competitorChartElement.style.height = height;
            competitorChartElement.style.minHeight = height;
          };
          const initialCompetitorChartLayout = currentCompetitorChartLayout();
          syncCompetitorChartHeight(initialCompetitorChartLayout);
          const maximum = Math.max(
            10,
            ...competitors.map((row) => finiteNumber(row?.mention_share) || 0)
          );
          const axisMaximum = Math.min(100, Math.ceil(maximum / 5) * 5);
          const competitorData = competitors.map((row) => {
            const relationship = String(row?.relationship || "");
            const color = relationship === "parent"
              ? "#ff324b"
              : relationship === "portfolio"
              ? "#465463"
              : "#aeb9c4";
            return {
              value: finiteNumber(row?.mention_share),
              meta: row,
              itemStyle: {
                color,
                borderRadius: [0, 6, 6, 0]
              }
            };
          });
          const competitorTooltipConfig = {
            ...chartTooltip,
            trigger: "item",
            triggerOn: "mousemove|click",
            backgroundColor: "#ffffff",
            borderColor: "#dce2e8",
            borderWidth: 1,
            borderRadius: 12,
            padding: 0,
            textStyle: {
              color: "#101011",
              fontFamily: "Manrope, system-ui, sans-serif",
              fontSize: 11
            },
            extraCssText: (
              "box-shadow:0 20px 52px rgba(16,16,17,.18);"
              + "max-width:min(360px,calc(100vw - 32px));white-space:normal;"
            )
          };
          const competitorTooltip = (params) => {
            const row = params?.data?.meta || {};
            const mentionCount = finiteNumber(row.mention_count);
            const totalAnswers = finiteNumber(row.total_answers);
            const counts = mentionCount !== null && totalAnswers !== null
              ? `${safeNumber(mentionCount)} из ${safeNumber(totalAnswers)} валидных ответов`
              : "Числитель или база расчёта не указаны";

                  alt=""
                  loading="lazy"
                  decoding="async"

      };

      const render = () => {
        stopHeadlineRotation();

        if (state.view === "home") renderHome();
        else if (state.view === "history") renderHistory();
        else if (state.view === "progress") renderProgress();
        else if (state.view === "report") renderReport();
        else if (state.view === "error") renderError();
        else app.innerHTML = `
          <div class="loading-screen">
            <div class="loading-inner">
              <img
                class="loading-mark"
                src="/static/brand/rw-plus-loader.png"
                width="200"
                height="200"
                alt=""
                aria-hidden="true"
              >
              <span>Загружаем данные…</span>
            </div>
          </div>
        `;
        bindEvents();
        initHeadlineRotation();
      };

      const updateRunView = (run) => {
        if (state.run && !canApplyRunUpdate(state.run, run)) return false;
        state.run = run;
        const lifecycle = runLifecycleState(run);
        if (lifecycle === "completed") {
          state.view = "report";
          closeStreams();
        } else if (lifecycle === "failed") {
          state.view = "error";
          closeStreams();
        } else {
          state.view = "progress";
        }
        render();
        return true;
      };

      const loadRun = async (runId, sharedToken = null) => {
        closeStreams();
        const fetchToken = ++state.runFetchToken;
        state.run = null;
        state.view = "loading";
        render();
        try {
          const run = await fetchJSON(
            sharedToken ? `/api/shared/${encodeURIComponent(sharedToken)}` : `/api/runs/${encodeURIComponent(runId)}`
          );
          if (fetchToken !== state.runFetchToken) return;
          updateRunView(run);
          if (
            !sharedToken
            && !["completed", "failed"].includes(runLifecycleState(run))
          ) {
            watchRun(run.id);
          }
        } catch (error) {
          if (fetchToken !== state.runFetchToken) return;
          state.run = {
            domain: "",
            error_message: error.message
          };
          state.view = "error";
          render();
        }
      };

      const refreshRun = async (runId) => {
        const fetchToken = ++state.runFetchToken;
        try {
          const run = await fetchJSON(`/api/runs/${encodeURIComponent(runId)}`);
          if (fetchToken !== state.runFetchToken) return;
          if (state.run?.id && state.run.id !== runId) return;
          updateRunView(run);
        } catch (_error) {
          // EventSource or the next polling cycle can recover.
        }
      };

      const watchRun = (runId) => {
        closeStreams();
        const source = new EventSource(`/api/runs/${encodeURIComponent(runId)}/events`);
        state.eventSource = source;
        source.onmessage = async (event) => {
          let payload;
          try {
            payload = JSON.parse(event.data);
          } catch (_error) {
            return;
          }
          if (!state.run || state.run.id !== runId) return;
          if (payload.type === "stage" || payload.type === "progress") {
            const inferredState = payload.run_state || (
              payload.stage === "recovering" ? "recovering" : "running"
            );
            const eventUpdate = {
              id: runId,
              state_revision: payload.state_revision
            };
            if (!canApplyRunUpdate(state.run, eventUpdate)) return;
            state.run = {
              ...state.run,
              stage_key: payload.stage || state.run.stage_key,
              stage_label: payload.label || state.run.stage_label,
              stage_detail: payload.detail || state.run.stage_detail,
              progress_percent: payload.percent ?? state.run.progress_percent,
              eta_seconds: finiteNumber(payload.eta_seconds),
              run_state: inferredState,
              state_revision: payload.state_revision,
              queue_position: payload.queue_position ?? (
                inferredState === "running" ? null : state.run.queue_position
              ),
              queue_total: payload.queue_total ?? (
                inferredState === "running" ? null : state.run.queue_total
              )
            };
            state.view = "progress";
            render();
          }
          if (payload.type === "final") {
            const eventUpdate = {
              id: runId,
              state_revision: payload.state_revision
            };
            if (!canApplyRunUpdate(state.run, eventUpdate)) return;
            source.close();
            await refreshRun(runId);
          }
        };
        source.onerror = () => {
          // Native EventSource reconnects automatically. Polling below is the fallback.
        };
        state.pollTimer = setInterval(() => refreshRun(runId), 10000);
      };

      const refreshHistory = async ({ showLoading = false } = {}) => {
        if (state.historyRefreshInFlight) return;
        const fetchToken = ++state.historyFetchToken;
        state.historyRefreshInFlight = true;
        if (showLoading) {
          state.historyLoading = true;
          state.historyError = "";
          if (state.view === "history") render();
        }
        try {
          const runs = await loadPublicRuns();
          if (
            state.view !== "history"
            || fetchToken !== state.historyFetchToken
          ) {
            return;
          }
          state.runs = mergeRunListsByRevision(state.runs, runs);
          state.historyError = "";
        } catch (error) {
          if (
            state.view === "history"
            && fetchToken === state.historyFetchToken
          ) {
            state.historyError = (
              error.message
              || "Не удалось получить историю проверок."
            );
          }
        } finally {
          if (fetchToken !== state.historyFetchToken) return;
          state.historyRefreshInFlight = false;
          state.historyLoading = false;
          if (state.view === "history") render();
        }
      };

      const startHistoryWatch = () => {
        if (state.historyPollTimer) clearInterval(state.historyPollTimer);
        state.historyPollTimer = setInterval(
          () => refreshHistory(),
          10000
        );
      };

      const startRun = async (domain) => {
        state.submitting = true;
        state.domainError = "";
        render();
        try {
          const result = await fetchJSON("/api/runs", {
            method: "POST",
            body: JSON.stringify({ domain })
          });
          setURL(result.run_id);
          await loadRun(result.run_id);
        } catch (error) {
          state.submitting = false;
          state.domainError = error.message;
          state.view = "home";
          render();
          requestAnimationFrame(() => document.getElementById("domain-input")?.focus());
        }
      };

      const validateDomain = (value) => {
        const raw = String(value || "").trim();
        if (!raw) return "Введите адрес сайта.";
        try {
          const url = new URL(raw.includes("://") ? raw : `https://${raw}`);
          if (!url.hostname || !url.hostname.includes(".")) {
            return "Укажите домен с зоной, например example.ru.";
          }
          return "";
        } catch (_error) {
          return "Проверьте адрес. Подойдёт формат example.ru.";
        }
      };

      const openHome = async (updateURL = true) => {
        closeStreams();
        state.shared = false;
        state.run = null;
        state.domainError = "";
        state.submitting = false;
        if (updateURL) setURL();
        state.view = "home";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const newRun = () => openHome(true);

      const openHistory = async (updateURL = true) => {
        closeStreams();
        state.shared = false;
        state.run = null;
        state.domainError = "";
        state.submitting = false;
        state.historyLoading = true;
        state.historyError = "";
        if (updateURL) setHistoryURL();
        state.view = "history";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        if (state.view !== "history") return;
        await refreshHistory();
        if (state.view === "history") startHistoryWatch();
      };

      const retryRun = async () => {
        if (!state.run?.id) return;
        try {
          await fetchJSON(`/api/runs/${encodeURIComponent(state.run.id)}/retry`, {
            method: "POST",
            body: "{}"
          });
          await loadRun(state.run.id);
        } catch (error) {
          showToast(error.message);
        }
      };

      const shareRun = async () => {
        if (!state.run?.id) return;
        try {
          const result = await fetchJSON(`/api/runs/${encodeURIComponent(state.run.id)}/share`, {
            method: "POST",
            body: "{}"
          });
          const url = new URL(result.share_url, window.location.origin).href;
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(url);
          } else {
            const field = document.createElement("textarea");
            field.value = url;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            const copied = document.execCommand("copy");
            field.remove();
            if (!copied) throw new Error("Не удалось скопировать ссылку.");
          }
          showToast("Ссылка на отчёт скопирована.");
        } catch (error) {
          showToast(error.message || "Не удалось скопировать ссылку.");
        }
      };

      function bindEvents() {
        document.querySelectorAll("[data-new-run]").forEach((button) => {
          button.addEventListener("click", newRun);
        });
        document.querySelectorAll("[data-share]").forEach((button) => {
          button.addEventListener("click", shareRun);
        });
        document.querySelectorAll("[data-retry]").forEach((button) => {
          button.addEventListener("click", retryRun);
        });
        document.querySelectorAll("[data-retry-history]").forEach((button) => {
          button.addEventListener("click", () => {
            refreshHistory({ showLoading: state.runs.length === 0 });
          });
        });
        document.querySelectorAll("[data-hard-refresh]").forEach((button) => {
          button.addEventListener("click", () => window.location.reload());
        });
        document.querySelectorAll("[data-open-run]").forEach((button) => {
          button.addEventListener("click", () => {
            const runId = button.getAttribute("data-open-run");
            if (!runId) return;
            setURL(runId);
            loadRun(runId);
          });
        });
        document.querySelectorAll("[data-history-link]").forEach((link) => {
          link.addEventListener("click", (event) => {
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            openHistory(true);
          });
        });
        document.querySelectorAll("[data-home-link]").forEach((link) => {
          link.addEventListener("click", (event) => {
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            newRun();
          });
        });
        const form = document.getElementById("domain-form");
        if (form) {
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            const input = document.getElementById("domain-input");
            const value = input?.value || "";
            const error = validateDomain(value);
            if (error) {
              state.domainError = error;
              render();
              requestAnimationFrame(() => document.getElementById("domain-input")?.focus());
              return;
            }
            startRun(value);
          });
        }
      }

      const routeFromLocation = async () => {
        const sharedMatch = window.location.pathname.match(/^\/r\/([^/]+)$/);
        if (sharedMatch) {
          state.shared = true;
          await loadRun("", decodeURIComponent(sharedMatch[1]));
          return;
        }
        const runId = new URLSearchParams(window.location.search).get("run");
        if (runId) {
          await loadRun(runId);
          return;
        }
        if (
          window.location.pathname === "/history"
          || window.location.hash === "#history"
        ) {
          await openHistory(false);
          return;
        }
        await openHome(false);
      };

      const boot = () => routeFromLocation();

      const startUIVersionWatch = () => {
        if (state.uiVersionTimer) clearInterval(state.uiVersionTimer);
        state.uiVersionTimer = setInterval(checkUIVersion, 60000);
        window.addEventListener("focus", checkUIVersion);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkUIVersion();
        });
      };

      let routeFrame = null;
      const scheduleLocationRoute = () => {
        if (routeFrame !== null) window.cancelAnimationFrame(routeFrame);
        routeFrame = window.requestAnimationFrame(() => {
          routeFrame = null;
          routeFromLocation();
        });
      };

      window.addEventListener("popstate", scheduleLocationRoute);
      window.addEventListener("hashchange", scheduleLocationRoute);

      startUIVersionWatch();
      boot();
    });
  </script>
</body>
</html>
