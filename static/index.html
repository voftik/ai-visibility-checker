      const analysisDocumentSections = (markdown) => {
        const fragment = sanitizeMarkdownFragment(markdown);
        const sourceNodes = meaningfulAnalysisNodes([...fragment.childNodes]);
        if (!sourceNodes.length) return [];
        const sections = [];
        let documentTitle = "";
        let beforeFirstSection = [];
        let current = null;
        const commit = () => {
          if (!current) return;
          current.nodes = meaningfulAnalysisNodes(current.nodes);
          sections.push(current);
          current = null;
        };
        sourceNodes.forEach((node) => {
          const tagName = node.nodeType === Node.ELEMENT_NODE ? node.tagName : "";
          if (tagName === "H1" && !documentTitle && !current) {
            documentTitle = String(node.textContent || "").trim();
            return;
          }
          if (tagName === "H2") {
            const sectionTitle = String(node.textContent || "").trim();
            if (!sectionTitle) return;
            if (!sections.length && !current && beforeFirstSection.length) {
              sections.push({
                title: documentTitle || "Общий вывод",
                nodes: meaningfulAnalysisNodes(beforeFirstSection),
                overview: true
              });
              beforeFirstSection = [];
            }
            commit();
            current = {
              title: sectionTitle,
              nodes: [],
              overview: false
            };
            return;
          }
          if (current) current.nodes.push(node);
          else beforeFirstSection.push(node);
        });
        commit();
        if (beforeFirstSection.length) {
          sections.unshift({
            title: documentTitle || "Общий вывод",
            nodes: meaningfulAnalysisNodes(beforeFirstSection),
            overview: true
          });
        }
        if (!sections.length) {
          sections.push({
            title: documentTitle || "Аналитический комментарий",
            nodes: [],
            overview: true
          });
        }
        return sections;
      };

      const analysisSectionLead = (section) => {
        const paragraphIndex = section.nodes.findIndex((node) => (
          node.nodeType === Node.ELEMENT_NODE && node.tagName === "P"
        ));
        if (paragraphIndex < 0) return "";
        const paragraph = section.nodes[paragraphIndex];
        const fullText = String(paragraph.textContent || "").replace(/\s+/g, " ").trim();
        if (!fullText) return "";
        const explicitLead = /^(?:вывод|вердикт)[.:]\s*/i.test(fullText);
        const cleanText = fullText.replace(/^(?:вывод|вердикт)[.:]\s*/i, "").trim();
        if (explicitLead) section.nodes.splice(paragraphIndex, 1);
        if (explicitLead || cleanText.length <= 220) return cleanText;
        const firstSentence = cleanText.match(/^.{1,220}?[.!?](?:\s|$)/)?.[0]?.trim();
        return firstSentence || `${cleanText.slice(0, 217).trim()}…`;
      };

        [...root.querySelectorAll("table")].forEach((table) => {
          if (table.parentElement?.classList.contains("analysis-table-scroll")) return;

          wrapper.className = "analysis-table-scroll";
          wrapper.tabIndex = 0;
          wrapper.setAttribute("role", "region");
          wrapper.setAttribute("aria-label", "Таблица с данными раздела");
          table.replaceWith(wrapper);
          wrapper.appendChild(table);
        });

        const replacements = [
          [/помечены как server_rendered/giu, "отдают текст в серверном HTML"],
          [/помечена как utility/giu, "отнесена к служебным"],
          [/стратегия рендеринга unknown при низкой уверенности/giu, "способ рендеринга не определён; уверенность низкая"],
          [/brand_knowledge\.web\.facets/giu, "аспекты ответов о названном бренде с веб-поиском"],
          [/brand_knowledge\.web/giu, "ответы о названном бренде с веб-поиском"],
          [/intents:\s*portfolio_capture/giu, "видимость продуктов по сценариям"],
          [/content_pages_evaluated/giu, "проверенные содержательные страницы"],
          [/utility_pages_excluded/giu, "исключённые служебные страницы"],
          [/render_confidence/giu, "уверенность определения рендеринга"],
          [/contradiction_count/giu, "ответы с расхождениями в фактах"],
          [/structured_pages/giu, "страницы со структурированными данными"],
          [/competitors:/giu, "упоминания брендов:"],
          [/server_rendered/giu, "текст в серверном HTML"],
          [/\bportfolio_capture\b/giu, "видимость продуктов"],
          [/\butility\b/giu, "служебная страница"],
          [/\bmedium\b/giu, "средняя"],
          [/\bunknown\b/giu, "данных недостаточно"]
        ];
        return replacements.reduce(
          (text, [pattern, replacement]) => text.replace(pattern, replacement),
          String(value || "")
        );
      };

      const localizeAnalysisEvidence = (root) => {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach((node) => {
          if (node.parentElement?.closest("code, pre, a")) return;
          node.nodeValue = localizeAnalysisText(node.nodeValue);

              nodes: []

            subSections.push(currentSubSection);
          } else if (currentSubSection) {

            introNodes.push(node);

          const prose = document.createElement("div");
          prose.className = "prose analysis-prose";

        return `
          <aside class="execution-slot execution-slot--${escapeHTML(lifecycle)}" aria-label="Очередь проверок">
            <div class="execution-slot-head">
              <span>Одна проверка за раз</span>
              <strong>${escapeHTML(status)}</strong>
            </div>
            <div class="execution-slot-visual" aria-hidden="true">
              <span class="execution-ticket">
                <span>${escapeHTML(domain)}</span>
                <strong>${escapeHTML(ticket)}</strong>
              </span>
              <span class="execution-flow"></span>
              <span class="execution-slot-cell">01</span>
            </div>
            <p class="execution-slot-copy">${escapeHTML(copy)}</p>
          </aside>
        `;
      };

      const progressPresentation = (run) => {
        const lifecycle = runLifecycleState(run);
        const position = queuePosition(run);
        const positionLabel = queuePositionLabel(run);
        const progress = Math.max(
          0,
          Math.min(100, Math.round(finiteNumber(run.progress_percent) || 0))
        );
        if (lifecycle === "queued") {
          return {
            lifecycle,
            value: position === null ? "—" : `№ ${position}`,
            suffix: "",
            title: "В очереди",
            detail: positionLabel
              ? `Позиция в очереди: ${positionLabel}. Начнём автоматически после текущей проверки.`
              : "Проверка сохранена. Позиция появится после обновления очереди.",
            etaLabel: "Начало",
            etaValue: "Время уточняется"
          };
        }
        if (lifecycle === "recovering") {
          return {
            lifecycle,
            value: position === null ? safeNumber(progress) : `№ ${position}`,
            suffix: position === null ? "%" : "",
            title: "Восстанавливаем проверку",
            detail: positionLabel
              ? `Сохранённые результаты не пропали. Сейчас вы ${positionLabel} в очереди.`
              : "Сохранённые результаты не пропали. Продолжим автоматически с последней точки.",
            etaLabel: "Продолжение",
            etaValue: "Время уточняется"
          };
        }
        const eta = formatEta(run.eta_seconds);
        return {
          lifecycle,
          value: safeNumber(progress),
          suffix: "%",
          title: run.stage_label || "Проверка идёт",
          detail: run.stage_detail || "Собираем данные для анализа.",
          etaLabel: "Осталось",
          etaValue: eta || "Время уточняется"
        };
      };

      const renderProgress = () => {
        const run = state.run || {};
        const presentation = progressPresentation(run);
        document.title = `${presentation.title} — RW+`;
        const currentIndex = stages.findIndex(
          (stage) => stage.key === run.stage_key
        );
        const hasActiveStage = (
          presentation.lifecycle === "running"
          && currentIndex >= 0
        );
        const stageRows = stages.map((stage, index) => {
          const status = hasActiveStage && index < currentIndex
            ? "done"
            : hasActiveStage && index === currentIndex
              ? "active"
              : "";
          const statusLabel = hasActiveStage && index < currentIndex
            ? "Готово"
            : hasActiveStage && index === currentIndex
              ? "Сейчас"
              : "Дальше";
          return `
            <li class="stage-row ${status}">
              <span class="stage-index" aria-hidden="true">
                ${hasActiveStage && index < currentIndex
                  ? icon("check")
                  : String(index + 1).padStart(2, "0")}
              </span>
              <div>
                <h2 class="stage-name">${escapeHTML(stage.label)}</h2>
                <p class="stage-copy">${escapeHTML(stage.copy)}</p>
              </div>
              <span class="stage-status">${statusLabel}</span>
            </li>
          `;
        }).join("");

        app.innerHTML = `
          <div class="site-shell progress-page">
            <div class="progress-layout">
              <section class="progress-summary">
                <span class="progress-domain">${escapeHTML(run.domain || "")}</span>
                <p class="progress-value progress-value--${escapeHTML(presentation.lifecycle)}">
                  ${escapeHTML(presentation.value)}${presentation.suffix
                    ? `<small>${escapeHTML(presentation.suffix)}</small>`
                    : ""}
                </p>
                <h1 class="progress-stage-title">${escapeHTML(presentation.title)}</h1>
                <p class="progress-detail">
                  ${escapeHTML(presentation.detail)}
                </p>
                <div class="eta">
                  <span>${escapeHTML(presentation.etaLabel)}</span>
                  <strong>${escapeHTML(presentation.etaValue)}</strong>
                </div>
                ${executionSlotHTML(run, presentation.lifecycle)}
                <figure class="progress-visual">
                  <img
                    src="/static/brand/generated/aiv-progress-map.webp"
                    width="1600"
                    height="1195"
                    alt="Сайт проходит проверку доступности, сценариев выбора, ответов ИИ и итогового сравнения."
                    decoding="async"
                  >
                </figure>
              </section>
              <ol class="stage-list">${stageRows}</ol>
            </div>
          </div>
        `;
      };

      const metricHTML = (metric, key) => {
        const value = finiteNumber(metric?.value);
        const observational = isObservationalMemoryMetric(metric);
        let formatted = "Нет данных";
        if (value !== null) {
          const prefix = key === "knowledge_gap" && value > 0 ? "+" : "";
          formatted = `${prefix}${safeNumber(value, value % 1 ? 1 : 0)}`;
        }
        const coverage = key === "technical_access"
          ? technicalCoveragePresentation(metric)
          : null;
        const metricState = observational
          ? "Исторический срез · отключение веба не аттестовано"
          : ({
          available: "Данные получены",
          strong: "Сильный результат",
          visible: "Заметный результат",
          weak: "Есть потенциал роста",
          limited: "Выборка обработана частично",
          unavailable: "Показатель не измерялся",
          unknown: "Состояние не определено"
        }[String(metric?.state || "").toLowerCase()] || (
          value === null ? "Показатель не рассчитан" : "По текущему экспресс-снимку"
        ));
        return `
          <article class="metric${observational ? " is-observational" : ""}">
            <span class="metric-label">${escapeHTML(metric?.label || "")}</span>
            <div>
              <div class="metric-number ${value === null ? "is-text" : ""}">
                ${escapeHTML(formatted)}${value === null
                  ? ""
                  : `<span class="metric-unit">${escapeHTML(metric?.unit || "")}</span>`
                }
              </div>
              <span class="metric-context">
                ${coverage ? `
                  <span class="coverage-badge ${escapeHTML(coverage.className)}">
                    ${escapeHTML(coverage.badge)}
                  </span>
                  <span>${escapeHTML(coverage.detail)}</span>
                ` : escapeHTML(metricState)}
              </span>
            </div>
          </article>
        `;
      };

      const formatPercent = (value, digits = 1) => {
        const number = finiteNumber(value);
        return number === null ? "—" : `${safeNumber(number, digits)}%`;
      };

      const barRows = (rows, valueKey, targetName = null, options = {}) => {
        if (!Array.isArray(rows) || !rows.length) {
          return `<p class="bar-unknown">Данных пока недостаточно.</p>`;
        }
        const scale = options.scale === "adaptive" ? "adaptive" : "absolute";
        const values = rows
          .map((row) => finiteNumber(row?.[valueKey]))
          .filter((value) => value !== null && value >= 0);
        const adaptiveMax = values.length ? Math.max(...values) : null;
        const normalizedTarget = String(targetName || "").trim().toLocaleLowerCase("ru-RU");
        return rows.map((row) => {
          const value = finiteNumber(row?.[valueKey]);
          const isTarget = Boolean(
            row?.is_target
            || (
              normalizedTarget
              && String(row?.name || "").trim().toLocaleLowerCase("ru-RU") === normalizedTarget
            )
          );
          let width = 0;
          if (value !== null && value > 0) {
            width = scale === "adaptive" && adaptiveMax
              ? Math.max(2, Math.min(100, value / adaptiveMax * 100))
              : Math.max(0, Math.min(100, value));
          }
          const valueText = formatPercent(value);
          const scaleText = scale === "adaptive" && adaptiveMax !== null
            ? ` Шкала относительно максимума ${formatPercent(adaptiveMax)}.`
            : "";
          const countText = finiteNumber(row?.count) !== null
            ? ` ${safeNumber(row.count)} упоминаний.`
            : "";
          const ariaLabel = `${row?.name || "Без названия"}: ${
            value === null ? "данных недостаточно" : valueText
          }.${countText}${scaleText}`;
          return `
            <div
              class="bar-row ${isTarget ? "is-target" : ""}"
              role="img"
              aria-label="${escapeHTML(ariaLabel)}"
            >
              <span class="bar-name">${escapeHTML(row.name || "")}</span>
              <span
                class="bar-track ${value === null ? "is-unknown" : ""} ${value === 0 ? "has-zero" : ""}"
                aria-hidden="true"
              >
                <span class="bar-fill ${isTarget ? "accent" : ""}" style="width:${width}%"></span>
              </span>
              <span class="bar-value">${valueText}</span>
            </div>
          `;
        }).join("");
      };

      const normalizeHeadline = (value) => String(value || "")
        .replace(/\s+/g, " ")
        .trim();

      const headlineSegmentClass = (emphasis) => {
        const value = String(emphasis || "").toLowerCase();
        if (["accent", "primary", "strong", "large"].includes(value)) {
          return "headline-segment--accent";
        }
        if (["support", "secondary", "quiet", "small"].includes(value)) {
          return "headline-segment--support";
        }
        return "headline-segment--normal";
      };

      const renderHeadlineSegments = (headline, segments) => {
        if (!Array.isArray(segments) || !segments.length) return null;
        const safeSegments = segments
          .map((segment) => (
            typeof segment === "string"
              ? { text: segment, emphasis: "normal" }
              : {
                  text: String(segment?.text || ""),
                  emphasis: segment?.emphasis || segment?.role || "normal"
                }
          ))
          .filter((segment) => segment.text);
        if (!safeSegments.length) return null;
        let separator = "";
        if (normalizeHeadline(safeSegments.map((segment) => segment.text).join("")) !== normalizeHeadline(headline)) {
          separator = " ";
        }
        if (
          normalizeHeadline(safeSegments.map((segment) => segment.text).join(separator))
          !== normalizeHeadline(headline)
        ) {
          return null;
        }
        return safeSegments.map((segment) => (
          `<span class="headline-segment ${headlineSegmentClass(segment.emphasis)}">${escapeHTML(segment.text)}</span>`
        )).join(separator);
      };

      const renderHeadlineEmphasis = (headline, emphasis) => {
        const phrases = [];
        if (typeof emphasis === "string") {
          phrases.push({ text: emphasis, emphasis: "accent" });
        } else if (Array.isArray(emphasis)) {
          emphasis.forEach((item, index) => {
            if (typeof item === "string") {
              phrases.push({ text: item, emphasis: index ? "support" : "accent" });
            } else if (item?.text) {
              phrases.push({
                text: String(item.text),
                emphasis: item.emphasis || item.role || (index ? "support" : "accent")
              });
            }
          });
        } else if (emphasis && typeof emphasis === "object") {
          for (const [role, value] of Object.entries(emphasis)) {
            const items = Array.isArray(value) ? value : [value];
            items.forEach((item) => {
              if (typeof item === "string" && item.trim()) {
                phrases.push({ text: item, emphasis: role });
              }
            });
          }
        }
        const lowerHeadline = headline.toLocaleLowerCase("ru-RU");
        const matches = phrases
          .map((phrase) => ({
            ...phrase,
            index: lowerHeadline.indexOf(phrase.text.toLocaleLowerCase("ru-RU"))
          }))
          .filter((phrase) => phrase.index >= 0)
          .sort((left, right) => left.index - right.index);
        if (!matches.length) return escapeHTML(headline);
        const segments = [];
        let cursor = 0;
        for (const match of matches) {
          if (match.index < cursor) continue;
          if (match.index > cursor) {
            segments.push({ text: headline.slice(cursor, match.index), emphasis: "normal" });
          }
          segments.push({
            text: headline.slice(match.index, match.index + match.text.length),
            emphasis: match.emphasis
          });
          cursor = match.index + match.text.length;
        }
        if (cursor < headline.length) {
          segments.push({ text: headline.slice(cursor), emphasis: "normal" });
        }
        return renderHeadlineSegments(headline, segments) || escapeHTML(headline);
      };

      const headlineHTML = (narrative, fallback) => {
        const headline = String(narrative?.headline || fallback || "").trim();
        return (
          renderHeadlineSegments(headline, narrative?.headline_segments)
          || renderHeadlineEmphasis(headline, narrative?.headline_emphasis)
          || escapeHTML(headline)
        );
      };

      const firstFinite = (...values) => {
        for (const value of values) {
          const number = finiteNumber(value);
          if (number !== null) return number;
        }
        return null;
      };

      const pluralizePages = (value) => {
        const count = Math.max(0, Math.round(finiteNumber(value) || 0));
        const mod10 = count % 10;
        const mod100 = count % 100;
        const noun = mod10 === 1 && mod100 !== 11
          ? "страница"
          : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)
          ? "страницы"
          : "страниц";
        return `${safeNumber(count)} ${noun}`;
      };

      const pluralizeValidAnswers = (value, { afterPo = false } = {}) => {
        const count = Math.max(0, Math.round(finiteNumber(value) || 0));
        const mod10 = count % 10;
        const mod100 = count % 100;
        const singular = mod10 === 1 && mod100 !== 11;
        const few = mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14);
        const noun = singular
          ? (afterPo ? "валидному ответу" : "валидный ответ")
          : few
          ? "валидных ответа"
          : "валидных ответов";
        return `${safeNumber(count)} ${noun}`;
      };

      const technicalCoveragePresentation = (metric = {}) => {
        const evaluated = finiteNumber(metric?.evaluated_pages);
        const discovered = finiteNumber(metric?.discovered_pages);
        const rawState = String(metric?.coverage_state || "").toLowerCase();
        let state = rawState;
        if (discovered !== null && discovered > 0 && evaluated !== null) {
          state = evaluated >= discovered ? "complete" : "limited";
        } else if (state !== "limited") {
          state = "unknown";
        }
        if (state === "complete") {
          return {
            state,
            className: "is-complete",
            badge: "Полный охват",
            detail: evaluated !== null && discovered !== null
              ? `${safeNumber(evaluated)} из ${pluralizePages(discovered)}`
              : "Проверены все найденные страницы"
          };
        }
        if (state === "limited") {
          return {
            state,
            className: "is-limited",
            badge: "Ограниченный срез",
            detail: evaluated !== null && discovered !== null
              ? `${safeNumber(evaluated)} из ${pluralizePages(discovered)}`
              : evaluated !== null
              ? pluralizePages(evaluated)
              : "Проверена часть найденных страниц"
          };
        }
        return {
          state: "unknown",
          className: "is-unknown",
          badge: "Охват не определён",
          detail: evaluated !== null
            ? `Проверено: ${pluralizePages(evaluated)}`
            : "Число проверенных страниц не указано"
        };
      };

      const metricRate = (metric, keys = ["score"]) => {
        if (finiteNumber(metric) !== null) return finiteNumber(metric);
        if (!metric || typeof metric !== "object") return null;
        for (const key of keys) {
          const number = finiteNumber(metric[key]);
          if (number !== null) return number;
        }
        return null;
      };

      const isFlatVisibilityMetric = (value) => (
        value
        && typeof value === "object"
        && ["score", "mention_rate", "top3_rate", "recommendation_rate"]
          .some((key) => Object.prototype.hasOwnProperty.call(value, key))
      );

      const normalizeMetricObject = (value) => {
        const numeric = finiteNumber(value);
        if (numeric !== null) {
          return {
            score: numeric,
            mention_rate: numeric,
            data_state: "complete"
          };
        }
        return value && typeof value === "object" ? value : null;
      };

      const observationalMemoryLimitation = (
        "Исторический срез был запрошен без веб-поиска. Ссылок и сигналов "
        + "обращения к веб-инструментам не обнаружено, но техническое "
        + "отключение веба в том запуске не аттестовано."
      );

      const isObservationalMemoryMetric = (metric) => Boolean(
        metric
        && typeof metric === "object"
        && (
          ["legacy_observational", "mixed"].includes(
            String(metric.evidence_state || "").toLowerCase()
          )
          || finiteNumber(metric.observational_answers) > 0
          || String(metric.limitation_reason || "").toLowerCase()
            === "legacy_memory_request_not_enforced"
        )
      );

      const memorySlicePresentation = (metrics = []) => {
        const availableMetrics = metrics.filter((metric) => (
          metric
          && typeof metric === "object"
          && String(metric.data_state || "").toLowerCase() !== "unavailable"
        ));
        const strict = Boolean(
          availableMetrics.length
          && availableMetrics.every(
            (metric) => metric.strict_no_web_verified === true
          )
        );
        const explicitObservational = availableMetrics.some(
          isObservationalMemoryMetric
        );
        const observational = Boolean(availableMetrics.length && !strict);
        const caveat = !observational
          ? ""
          : explicitObservational
          ? observationalMemoryLimitation
          : (
              "Сохранённый исторический срез не содержит технической "
              + "аттестации отключения веба. Значения описывают наблюдение, "
              + "а не подтверждённую память модели."
            );
        return {
          observational,
          strict,
          columnLabel: strict
            ? "Без веб-поиска"
            : observational
            ? "Исторический срез"
            : "Сохранённый срез",
          modeLabel: strict
            ? "без веб-поиска"
            : observational
            ? "в историческом срезе без зафиксированного веб-поиска"
            : "в сохранённом срезе",
          caveat
        };
      };

      const normalizeReport = (rawReport, run = {}) => {
        const report = rawReport && typeof rawReport === "object" ? rawReport : {};
        const explicitVersion = String(report.version || "");
        const hasV2Shape = Boolean(
          report.discovery?.parent
          || report.discovery?.portfolio
          || report.key_metrics?.parent_discovery
          || report.key_metrics?.portfolio_capture
        );
        const contract = hasV2Shape ? "v2" : "legacy";
        const contractIssue = (
          explicitVersion && !supportedReportVersions.has(explicitVersion)
            ? `Формат отчёта ${explicitVersion} новее этого интерфейса.`
            : ""
        );
        const legacyVisibility = report.visibility || {};
        const discovery = report.discovery || {};
        const parent = contract === "v2"
          ? discovery.parent || {}
          : (
            report.parent_discovery
            || (
              legacyVisibility.web || legacyVisibility.memory
                ? legacyVisibility
                : {}
            )
          );
        const portfolio = contract === "v2"
          ? discovery.portfolio || report.portfolio_visibility || {}
          : report.portfolio_visibility || {};
        const portfolioScope = (
          discovery.portfolio_scope
          || report.portfolio_scope
          || {}
        );
        const brandKnowledge = (
          report.brand_knowledge
          || legacyVisibility.brand_knowledge
          || {}
        );
        const brand = report.brand || {};
        const brandName = brand.name || run.domain || "Бренд";
        const rawMetrics = report.key_metrics || {};
        const buildMetric = (
          source,
          fallbackValue,
          label,
          unit,
          { forceLabel = false } = {}
        ) => {
          const metric = source && typeof source === "object"
            ? { ...source }
            : {};
          if (finiteNumber(metric.value) === null) metric.value = fallbackValue;
          if (forceLabel || !metric.label) metric.label = label;
          if (!metric.unit) metric.unit = unit;
          if (!metric.state && finiteNumber(metric.value) === null) {
            metric.state = "unavailable";
          }
          return metric;
        };
        const keyMetrics = contract === "v2"
          ? {
              technical_access: buildMetric(
                rawMetrics.technical_access,
                report.technical?.score,
                "Техническая готовность проверенного среза",
                "/ 100",
                { forceLabel: true }
              ),
              parent_discovery: buildMetric(
                rawMetrics.parent_discovery,
                metricRate(parent.web, ["score"]),
                "Индекс видимости бренда",
                "/ 100",
                { forceLabel: true }
              ),
              portfolio_capture: buildMetric(
                rawMetrics.portfolio_capture,
                metricRate(portfolio.web, ["score"]),
                "Индекс видимости продуктов",
                "/ 100",
                { forceLabel: true }
              ),
              brand_knowledge: buildMetric(
                rawMetrics.brand_knowledge,
                metricRate(brandKnowledge.memory, ["specific_rate"]),
                "Конкретика в сохранённом срезе",
                "%"
              )
            }
          : {
              technical_access: buildMetric(
                rawMetrics.technical_access,
                report.technical?.score,
                "Техническая готовность проверенного среза",
                "/ 100",
                { forceLabel: true }
              ),
              parent_discovery: buildMetric(
                rawMetrics.ai_visibility,
                metricRate(parent.web, ["score"]),
                "Индекс видимости бренда",
                "/ 100",
                { forceLabel: true }
              ),
              portfolio_capture: buildMetric(
                rawMetrics.knowledge_gap,
                metricRate(portfolio.web, ["score"]),
                "Индекс видимости предложения",
                "/ 100",
                { forceLabel: true }
              ),
              brand_knowledge: buildMetric(
                rawMetrics.recommendation,
                metricRate(brandKnowledge.memory, ["specific_rate", "answer_rate"]),
                "Конкретика в сохранённом срезе",
                "%"
              )
            };

        const sourceProviders = (
          contract === "v2"
            ? (
              Array.isArray(discovery.providers)
                ? discovery.providers
                : []
            )
            : (
              Array.isArray(legacyVisibility.providers)
                ? legacyVisibility.providers
                : []
            )
        );
        const knowledgeProviders = Array.isArray(brandKnowledge.providers)
          ? brandKnowledge.providers
          : [];
        const providerIndex = new Map();
        const ensureProvider = (name) => {
          const label = String(name || "").trim();
          if (!label) return null;
          const key = label.toLocaleLowerCase("ru-RU");
          if (!providerIndex.has(key)) {
            providerIndex.set(key, {
              name: label,
              parent: null,
              portfolio: null,
              knowledgeWeb: null,
              knowledgeMemory: null
            });
          }
          return providerIndex.get(key);
        };
        sourceProviders.forEach((provider) => {
          const target = ensureProvider(provider?.name);
          if (!target) return;
          if (contract === "v2") {
            target.parent = normalizeMetricObject(provider?.parent_discovery);
            target.portfolio = normalizeMetricObject(provider?.portfolio_capture);
          } else {
            target.parent = normalizeMetricObject(
              provider?.parent_discovery
              || (isFlatVisibilityMetric(provider) ? provider : null)
            );
            target.portfolio = normalizeMetricObject(provider?.portfolio_capture);
          }
          const knowledge = provider?.brand_knowledge;
          if (knowledge?.web || knowledge?.memory) {
            target.knowledgeWeb = normalizeMetricObject(knowledge.web);
            target.knowledgeMemory = normalizeMetricObject(knowledge.memory);
          } else if (knowledge) {
            target.knowledgeWeb = normalizeMetricObject(knowledge);
          }
        });
        knowledgeProviders.forEach((provider) => {
          const target = ensureProvider(provider?.name);
          if (!target) return;
          target.knowledgeWeb = (
            normalizeMetricObject(provider?.web)
            || target.knowledgeWeb
            || normalizeMetricObject(provider)
          );
          target.knowledgeMemory = (
            normalizeMetricObject(provider?.memory)
            || target.knowledgeMemory
          );
        });

        const sourceIntents = contract === "v2"
          ? (Array.isArray(discovery.intents) ? discovery.intents : [])
          : (Array.isArray(legacyVisibility.intents) ? legacyVisibility.intents : []);
        const intents = sourceIntents.map((intent) => ({
          intent: String(intent?.intent || ""),
          parent: normalizeMetricObject(
            intent?.parent_discovery
            || (
              contract === "legacy" && isFlatVisibilityMetric(intent)
                ? intent
                : null
            )
          ),
          portfolio: normalizeMetricObject(intent?.portfolio_capture)
        }));

        const technical = report.technical || {};
        const technicalPages = Array.isArray(technical.pages) ? technical.pages : [];
        const evaluatedPageFallback = technicalPages.length
          ? technicalPages.filter((page) => page?.is_utility !== true).length
          : null;
        const technicalCoverage = (
          technical.coverage && typeof technical.coverage === "object"
            ? technical.coverage
            : {}
        );
        const evaluatedPages = firstFinite(
          technicalCoverage.evaluated_pages,
          technical.summary?.evaluated_pages,
          technical.summary?.content_pages_evaluated,
          technical.rendering?.evaluated_pages,
          keyMetrics.technical_access.evaluated_pages,
          evaluatedPageFallback
        );
        const discoveredPages = firstFinite(
          technicalCoverage.discovered_pages,
          technicalCoverage.discovered_count,
          technical.summary?.discovered_pages,
          keyMetrics.technical_access.discovered_pages
        );
        const rawCoverageState = String(
          technicalCoverage.coverage_state
          || keyMetrics.technical_access.coverage_state
          || ""
        ).toLowerCase();
        const coverageState = discoveredPages !== null && discoveredPages > 0 && evaluatedPages !== null
          ? (evaluatedPages >= discoveredPages ? "complete" : "limited")
          : (rawCoverageState === "limited" ? "limited" : "unknown");
        const coverageRate = discoveredPages !== null && discoveredPages > 0 && evaluatedPages !== null
          ? Math.min(100, Math.max(0, evaluatedPages / discoveredPages * 100))
          : null;
        Object.assign(keyMetrics.technical_access, {
          label: "Техническая готовность проверенного среза",
          evaluated_pages: evaluatedPages,
          discovered_pages: discoveredPages,
          coverage_rate: coverageRate,
          coverage_state: coverageState
        });
        const completedRequiredMissing = run.status === "completed" && (
          finiteNumber(technical.score) === null
          || finiteNumber(keyMetrics.technical_access.value) === null
          || (
            finiteNumber(keyMetrics.parent_discovery.value) === null
            && finiteNumber(keyMetrics.portfolio_capture.value) === null
            && finiteNumber(keyMetrics.brand_knowledge.value) === null
          )
        );
        return {
          version: explicitVersion || (contract === "v2" ? "2026-07-v2" : "legacy"),
          contract,
          contractIssue,
          completedRequiredMissing,
          brand,
          brandName,
          domain: compactDomainLabel(run.domain || brand.website || brand.url || brandName),
          narrative: report.narrative || {},
          keyMetrics,
          technical,
          competitors: Array.isArray(report.competitors)
            ? report.competitors.map((row) => ({ ...row }))
            : [],
          parent,
          portfolio,
          portfolioScope,
          brandKnowledge,
          pairedWebLift: discovery.paired_web_lift || null,
          providers: [...providerIndex.values()],
          intents,
          illustrations: Array.isArray(report.illustrations) ? report.illustrations : [],
          sitePreview: (
            report.site_preview && typeof report.site_preview === "object"
              ? { ...report.site_preview }
              : null
          ),
          methodology: report.methodology || {}
        };
      };

      const stateLabel = (stateValue) => ({
        open: "Открыт",
        available: "Доступно",
        partial: "Частично",
        closed: "Закрыт",
        blocked: "Заблокировано",
        complete: "Данных достаточно",
        limited: "Часть данных",
        unknown: "Не определено",
        high: "Высокая уверенность",
        medium: "Средняя уверенность",
        low: "Низкая уверенность"
      }[String(stateValue || "").toLowerCase()] || String(stateValue || "Не определено"));

      const renderStrategyLabel = (strategy) => ({
        server_rendered: "Текст в HTML",
        server_readable: "Текст в HTML",
        hybrid: "Гибридно",
        client_rendered: "После JavaScript",
        client_rendered_shell: "После JavaScript",
        unknown: "Не определено"
      }[String(strategy || "").toLowerCase()] || String(strategy || "Не определено"));

      const pageKindLabel = (kind) => ({
        homepage: "Главная",
        home: "Главная",
        product: "Продукт",
        service: "Услуга",
        article: "Материал",
        category: "Раздел",
        about: "О компании",
        contact: "Контакты",
        utility: "Служебная",
        other: "Другая"
      }[String(kind || "").toLowerCase()] || String(kind || "Страница"));

      const compactURL = (value) => {
        const raw = String(value || "");
        if (!raw) return "";
        try {
          const url = new URL(raw, window.location.origin);
          const path = `${url.pathname}${url.search}`;
          return path === "/" ? url.hostname : path;
        } catch (_error) {
          return raw;
        }
      };

      const auditFactHTML = (fact) => {
        const numeric = finiteNumber(fact?.value);
        const value = numeric === null
          ? String(fact?.value || "—")
          : `${safeNumber(numeric, numeric % 1 ? 1 : 0)}${fact?.unit || ""}`;
        return `
          <article class="audit-fact">
            <span class="audit-fact-label">${escapeHTML(fact?.label || "")}</span>
            <div>
              <div class="audit-fact-value">${escapeHTML(value)}</div>
              ${fact?.detail ? `<p class="audit-fact-detail">${escapeHTML(fact.detail)}</p>` : ""}
            </div>
          </article>
        `;
      };

      const technicalFacts = (technical) => {
        const explicitFacts = (
          Array.isArray(technical?.summary?.facts)
            ? technical.summary.facts
            : Array.isArray(technical?.summary_facts)
            ? technical.summary_facts
            : Array.isArray(technical?.facts)
            ? technical.facts
            : []
        ).slice(0, 4);
        if (explicitFacts.length === 4) return explicitFacts;
        const pages = Array.isArray(technical?.pages) ? technical.pages : [];
        const contentPages = pages.filter((page) => page?.is_utility !== true);
        const structuredCount = contentPages.filter((page) => (
          Array.isArray(page?.structured_data_types) && page.structured_data_types.length
        )).length;
        const structuredShare = contentPages.length
          ? Math.round(structuredCount / contentPages.length * 100)
          : null;
        const serverShare = firstFinite(
          technical?.rendering?.server_readable_share,
          technical?.summary?.server_readable_share
        );
        const renderKnownPages = firstFinite(
          technical?.rendering?.evaluated_pages,
          serverShare === null ? null : contentPages.length
        );
        const renderUnknownPages = firstFinite(
          technical?.rendering?.unknown_pages,
          renderKnownPages === null ? null : Math.max(0, contentPages.length - renderKnownPages)
        );
        const renderConfirmedPages = (
          renderKnownPages !== null && serverShare !== null
            ? Math.round(renderKnownPages * serverShare / 100)
            : null
        );
        const renderingComplete = (
          renderUnknownPages === 0
          && renderKnownPages !== null
          && renderKnownPages === contentPages.length
        );
        return [
          {
            label: "Техническая готовность проверенного среза",
            value: finiteNumber(technical?.score),
            unit: "/100",
            detail: "Сводная оценка проверенных сигналов"
          },
          {
            label: "Правила robots.txt",
            value: stateLabel(technical?.robots?.state),
            detail: "Доступ для семейств ИИ-краулеров"
          },
          {
            label: "Текст читается с сервера",
            value: serverShare,
            unit: "%",
            detail: technical?.rendering?.evaluated_pages
              ? `Проверено страниц: ${safeNumber(technical.rendering.evaluated_pages)}`
              : "По подтверждённым страницам"
          },
          {
            label: "Страницы с разметкой",
            value: structuredShare,
            unit: "%",
            detail: contentPages.length
              ? `${structuredCount} из ${contentPages.length}`
              : "Недостаточно данных"
          }
        ];
      };

      const statusPillHTML = (state, label) => `
        <span class="status-pill ${escapeHTML(state || "")}">${escapeHTML(label)}</span>
      `;

      const technicalAuditRows = (technical) => {
        const pages = Array.isArray(technical?.pages) ? technical.pages : [];
        const contentPages = pages.filter((page) => page?.is_utility !== true);
        const families = Array.isArray(technical?.families) ? technical.families : [];
        const passedChecks = firstFinite(
          technical?.summary?.passed_checks,
          contentPages.reduce(
            (total, page) => total + (finiteNumber(page?.passed_checks) || 0),
            0
          )
        );
        const totalChecks = firstFinite(
          technical?.summary?.total_checks,
          contentPages.reduce(
            (total, page) => total + (finiteNumber(page?.total_checks) || 0),
            0
          )
        );
        const serverShare = firstFinite(
          technical?.rendering?.server_readable_share,
          technical?.summary?.server_readable_share
        );
        const renderKnownPages = firstFinite(
          technical?.rendering?.evaluated_pages,
          serverShare === null ? null : contentPages.length
        );
        const renderUnknownPages = firstFinite(
          technical?.rendering?.unknown_pages,
          renderKnownPages === null
            ? null
            : Math.max(0, contentPages.length - renderKnownPages)
        );
        const renderConfirmedPages = (
          renderKnownPages !== null && serverShare !== null
            ? Math.round(renderKnownPages * serverShare / 100)
            : null
        );
        const renderingComplete = (
          renderUnknownPages === 0
          && renderKnownPages !== null
          && renderKnownPages === contentPages.length
        );
        const structuredPages = firstFinite(
          technical?.summary?.structured_pages,
          contentPages.filter((page) => (
            Array.isArray(page?.structured_data_types)
            && page.structured_data_types.length
          )).length
        );
        const structuredTotal = firstFinite(
          technical?.summary?.structured_total,
          contentPages.length
        );
        const httpPassed = contentPages.filter((page) => {
          const status = finiteNumber(page?.http_status);
          return status !== null && status >= 200 && status < 400;
        }).length;
        const robotsState = String(technical?.robots?.state || "").toLowerCase();
        const robotsOpen = robotsState === "open";
        const robotsAllowedChecks = finiteNumber(technical?.robots?.allowed_checks);
        const robotsKnownChecks = finiteNumber(technical?.robots?.known_checks);
        const checkedRobotsPathsOpen = (
          robotsKnownChecks !== null
          && robotsKnownChecks > 0
          && robotsAllowedChecks === robotsKnownChecks
        );
        const auxiliaryStructuredPages = contentPages.filter((page) => (
          Array.isArray(page?.structured_data_types)
          && page.structured_data_types.length > 0
          && (
            !Array.isArray(page?.entity_structured_data_types)
            || page.entity_structured_data_types.length === 0
          )
        )).length;
        const coverageState = String(
          technical?.coverage?.coverage_state
          || technical?.coverage_state
          || "unknown"
        ).toLowerCase();
        const coverageRate = firstFinite(
          technical?.coverage?.coverage_rate,
          technical?.coverage_rate
        );
        const discoveredPages = firstFinite(
          technical?.coverage?.discovered_pages,
          technical?.discovered_pages
        );
        const authOpen = technical?.auth?.walls_detected === false;
        const familyPassed = families.filter((family) => (
          finiteNumber(family?.access_rate) !== null
          && finiteNumber(family.access_rate) >= 100
        )).length;
        const allChecksPassed = (
          totalChecks !== null
          && totalChecks > 0
          && passedChecks === totalChecks
        );
        const rows = [
          {
            group: "Доступ",
            check: "Правила robots.txt",
            state: robotsOpen ? "good" : checkedRobotsPathsOpen ? "limited" : robotsState ? "bad" : "limited",
            status: robotsOpen
              ? "Пройдено"
              : checkedRobotsPathsOpen
              ? "Проверенные URL разрешены"
              : robotsState
              ? "Есть ограничения"
              : "Не измерялось",
            result: robotsOpen
              ? "Доступ открыт"
              : checkedRobotsPathsOpen
              ? "Частичные правила; выбранные страницы открыты"
              : stateLabel(technical?.robots?.state),
            evidence: robotsKnownChecks
              ? `${safeNumber(robotsAllowedChecks)} из ${safeNumber(robotsKnownChecks)} проверок URL разрешены`
              : families.length
              ? `${familyPassed} из ${families.length} семейств проходят проверку`
              : "Нет результатов по семействам",
            impact: robotsOpen
              ? "Краулеры могут открыть публичные страницы"
              : checkedRobotsPathsOpen
              ? "Проверенный срез доступен; другие шаблоны адресов могут быть ограничены"
              : "Часть ИИ-систем может не увидеть первоисточник",
            action: robotsOpen
              ? "Сохранить правила при следующих релизах"
              : checkedRobotsPathsOpen
              ? "Проверить, что закрытые шаблоны не содержат важные материалы"
              : "Проверить запреты для ИИ-user-agent"
          },
          {
            group: "Доступ",
            check: "HTTP и ответы сервера",
            state: contentPages.length && httpPassed === contentPages.length ? "good" : "limited",
            status: contentPages.length && httpPassed === contentPages.length
              ? "Пройдено"
              : contentPages.length
              ? "Проверить"
              : "Не измерялось",
            result: contentPages.length
              ? `${httpPassed} из ${contentPages.length} страниц отвечают корректно`
              : "Нет содержательных страниц",
            evidence: allChecksPassed
              ? `${safeNumber(passedChecks)} из ${safeNumber(totalChecks)} проверок доступа`
              : totalChecks
              ? `${safeNumber(passedChecks)} из ${safeNumber(totalChecks)} проверок`
              : "Охват не определён",
            impact: "Модель получает содержимое только после успешного ответа сервера",
            action: httpPassed === contentPages.length && contentPages.length
              ? "Контролировать коды ответа после выкладок"
              : "Исправить ошибки ответа на содержательных URL"
          },
          {
            group: "Читаемость",
            check: "Основной текст с сервера",
            state: serverShare === null
              ? "limited"
              : serverShare >= 90 && renderingComplete
              ? "good"
              : serverShare >= 90
              ? "limited"
              : "bad",
            status: serverShare === null
              ? "Не измерялось"
              : serverShare >= 90 && renderingComplete
              ? "Пройдено"
              : serverShare >= 90
              ? "Частично проверено"
              : "Требует внимания",
            result: serverShare === null
              ? "Способ рендеринга не определён"
              : renderingComplete
              ? `${formatPercent(serverShare, 0)} подтверждённых страниц читаются без браузера`
              : renderConfirmedPages !== null && renderUnknownPages !== null
              ? `${safeNumber(renderConfirmedPages)} из ${contentPages.length} страниц подтверждены`
              : `${formatPercent(serverShare, 0)} среди страниц с известным способом рендеринга`,
            evidence: renderUnknownPages
              ? `${safeNumber(renderKnownPages)} проверено · ${safeNumber(renderUnknownPages)} не определено`
              : contentPages.length
              ? `${contentPages.length} содержательных стр. проверено`
              : "Нет подтверждённых страниц",
            impact: serverShare !== null && serverShare >= 90 && renderingComplete
              ? "JavaScript не нужен, чтобы дойти до основного смысла на проверенных страницах"
              : serverShare !== null && serverShare >= 90
              ? "Подтверждённые страницы читаются без JavaScript; неизвестные требуют отдельной проверки"
              : "Краулер может получить пустую клиентскую оболочку",
            action: serverShare !== null && serverShare >= 90 && renderingComplete
              ? "Сохранить серверную отдачу ключевого текста"
              : serverShare !== null && serverShare >= 90
              ? "Перепроверить страницы с неопределённым рендерингом"
              : "Добавить SSR, пререндеринг или статический HTML"
          },
          {
            group: "Читаемость",
            check: "Авторизация",
            state: authOpen ? "good" : technical?.auth ? "bad" : "limited",
            status: authOpen ? "Пройдено" : technical?.auth ? "Требует внимания" : "Не измерялось",
            result: authOpen
              ? "Публичный контент доступен без входа"
              : technical?.auth?.interpretation || "Состояние не определено",
            evidence: technical?.auth?.forms_present
              ? "Форма входа найдена; проверено, перекрывает ли она контент"
              : "Стена авторизации не обнаружена",
            impact: authOpen
              ? "ИИ читает тот же открытый материал, что и пользователь"
              : "Контент за стеной входа не участвует в обнаружении",
            action: authOpen
              ? "Не закрывать ключевые страницы авторизацией"
              : "Оставить публичное содержательное представление"
          },
          {
            group: "Сущности",
            check: "Сущностная Schema.org",
            state: structuredTotal && structuredPages === structuredTotal
              ? "good"
              : structuredTotal
              ? "bad"
              : "limited",
            status: structuredTotal && structuredPages === structuredTotal
              ? "Пройдено"
              : structuredTotal
              ? "Требует внимания"
              : "Не измерялось",
            result: structuredTotal
              ? `${safeNumber(structuredPages)} из ${safeNumber(structuredTotal)} страниц объясняют сущности`
              : "Нет данных о разметке",
            evidence: structuredTotal
              ? auxiliaryStructuredPages
                ? `На ${safeNumber(auxiliaryStructuredPages)} стр. есть только вспомогательная разметка; проверены Organization, Product, Service и Article`
                : "Проверены типы Organization, Product, Service и Article"
              : "Охват не определён",
            impact: structuredPages
              ? "Сущности получают явные машинные связи"
              : "Модель вынуждена угадывать бренд, продукты и их отношения по тексту",
            action: structuredTotal && structuredPages === structuredTotal
              ? "Проверять валидность разметки при релизах"
              : "Добавить JSON-LD, соответствующий видимому содержанию"
          },
          {
            group: "Охват",
            check: "Полнота технического среза",
            state: coverageState === "complete"
              ? "good"
              : contentPages.length
              ? "limited"
              : "bad",
            status: coverageState === "complete"
              ? "Проверены все найденные страницы"
              : contentPages.length
              ? "Ограниченный срез"
              : "Нет данных",
            result: contentPages.length
              ? discoveredPages !== null
                ? `${contentPages.length} из ${safeNumber(discoveredPages)} найденных страниц`
                : `${contentPages.length} содержательных страниц`
              : "Содержательные страницы не подтверждены",
            evidence: coverageRate !== null
              ? `Охват ${formatPercent(coverageRate, 1)} · ${pages.length - contentPages.length} служебных исключено`
              : contentPages.length
              ? contentPages.map((page) => compactURL(page?.url)).filter(Boolean).join(", ")
              : "Список URL пуст",
            impact: coverageState === "complete"
              ? "Выводы относятся ко всем найденным страницам"
              : "Оценка описывает только проверенную часть сайта",
            action: coverageState === "complete"
              ? "Повторять аудит после крупных изменений"
              : "Расширить обход на продукты, кейсы, статьи и ключевые разделы"
          }
        ];
        return rows;
      };

      const technicalAuditMatrixHTML = (technical) => {
        const rows = technicalAuditRows(technical);
        return `
          <div class="data-table-wrap">
            <table class="data-table audit-matrix-table">
              <thead>
                <tr>
                  <th scope="col">Проверка</th>
                  <th scope="col">Статус</th>
                  <th scope="col">Результат</th>
                  <th scope="col">Охват и доказательство</th>
                  <th scope="col">Влияние на ИИ</th>
                  <th scope="col">Что делать</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((row) => `
                  <tr>
                    <td data-label="Проверка">
                      <strong>${escapeHTML(row.check)}</strong>
                      <small>${escapeHTML(row.group)}</small>
                    </td>
                    <td data-label="Статус">${statusPillHTML(row.state, row.status)}</td>
                    <td data-label="Результат"><strong>${escapeHTML(row.result)}</strong></td>
                    <td data-label="Охват и доказательство">${escapeHTML(row.evidence)}</td>
                    <td data-label="Влияние на ИИ">${escapeHTML(row.impact)}</td>
                    <td data-label="Что делать">${escapeHTML(row.action)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      };

      const technicalAccessMatrixHTML = (technical) => {
        const pages = Array.isArray(technical?.pages) ? technical.pages : [];
        const families = Array.isArray(technical?.families)
          ? technical.families.map((family) => String(family?.name || "")).filter(Boolean)
          : [];
        if (!pages.length || !families.length) {
          return `<p class="bar-unknown">Матрица доступа не измерялась.</p>`;
        }
        return `
          <div class="data-table-wrap">
            <table class="data-table access-matrix-table">
              <thead>
                <tr>
                  <th scope="col">Страница</th>
                  ${families.map((family) => `<th scope="col">${escapeHTML(family)}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${pages.map((page) => {
                  const available = new Set(
                    Array.isArray(page?.accessible_families) ? page.accessible_families : []
                  );
                  const blocked = new Set(
                    Array.isArray(page?.blocked_families) ? page.blocked_families : []
                  );
                  return `
                    <tr>
                      <td data-label="Страница">
                        <strong>${escapeHTML(page?.title || compactURL(page?.url) || "Страница")}</strong>
                        <small>${escapeHTML(compactURL(page?.url))}</small>
                      </td>
                      ${families.map((family) => {
                        const state = page?.is_utility
                          ? "excluded"
                          : available.has(family)
                          ? "available"
                          : blocked.has(family)
                          ? "blocked"
                          : "excluded";
                        const label = state === "available"
                          ? "Доступно"
                          : state === "blocked"
                          ? "Закрыто"
                          : "Не оценивается";
                        return `
                          <td data-label="${escapeHTML(family)}">
                            <span class="access-state ${state}">${label}</span>
                          </td>
                        `;
                      }).join("")}
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      };

      const auditTooltipHTML = ({
        id,
        visibleHTML,
        title,
        copy,
        controlLabel,
        modifier = ""
      }) => `
        <span class="audit-tooltip ${escapeHTML(modifier)}" data-audit-tooltip>
          <span class="audit-tooltip-visible" data-audit-tooltip-anchor>
            ${visibleHTML}
          </span>
          <button
            class="audit-tooltip-button"
            type="button"
            aria-label="${escapeHTML(controlLabel || `Пояснение: ${title}`)}"
            aria-describedby="${escapeHTML(id)}"
            data-audit-tooltip-trigger
          >
            <span aria-hidden="true">i</span>
          </button>
          <span
            class="audit-tooltip-bubble"
            id="${escapeHTML(id)}"
            role="tooltip"
            data-audit-tooltip-bubble
          >
            <span class="audit-tooltip-title">${escapeHTML(title)}</span>
            <span class="audit-tooltip-copy">${escapeHTML(copy)}</span>
          </span>
        </span>
      `;

      const auditHeaderTooltipHTML = (id, label, copy) => auditTooltipHTML({
        id,
        visibleHTML: escapeHTML(label),
        title: label,
        copy,
        controlLabel: `Что означает «${label}»`,
        modifier: "audit-tooltip--header"
      });

      const httpTooltipCopy = (status, textLength) => {
        let responseCopy = "Код ответа сервера не получен";
        if (status !== null) {
          if (status >= 200 && status < 300) {
            responseCopy = `Код ${safeNumber(status)}: сервер успешно отдал страницу`;
          } else if (status >= 300 && status < 400) {
            responseCopy = `Код ${safeNumber(status)}: сервер перенаправил запрос`;
          } else if (status >= 400 && status < 500) {
            responseCopy = `Код ${safeNumber(status)}: страницу нельзя открыть по этому адресу`;
          } else if (status >= 500) {
            responseCopy = `Код ${safeNumber(status)}: сервер не смог отдать страницу`;
          } else {
            responseCopy = `Сервер вернул код ${safeNumber(status)}`;
          }
        }
        return textLength !== null
          ? `${responseCopy}. Краулер извлёк ${safeNumber(textLength)} знаков текста`
          : responseCopy;
      };

      const renderingTooltipCopy = (strategy, confidence) => {
        const strategyCopy = {
          server_rendered: "Основной текст найден сразу в серверном HTML",
          server_readable: "Основной текст найден сразу в серверном HTML",
          hybrid: "Часть текста есть в HTML, остальное появляется после запуска JavaScript",
          client_rendered: "Основной текст появляется только после запуска JavaScript",
          client_rendered_shell: "Основной текст появляется только после запуска JavaScript",
          unknown: "Не удалось надёжно определить, как появляется основной текст"
        }[String(strategy || "").toLowerCase()]
          || "Способ появления основного текста определён по ответу страницы";
        const confidenceCopy = {
          high: "Высокая уверенность в результате",
          medium: "Средняя уверенность: результат стоит перепроверить при изменении страницы",
          low: "Низкая уверенность: нужен повторный замер"
        }[String(confidence || "").toLowerCase()];
        return confidenceCopy ? `${strategyCopy}. ${confidenceCopy}` : strategyCopy;
      };

      const accessTooltipCopy = ({ isUtility, accessRate, accessible, blocked }) => {
        if (isUtility) {
          return "Служебную страницу показываем для прозрачности, но не включаем в проверку доступа ИИ";
        }
        const checkedFamilies = accessible.length + blocked.length;
        if (checkedFamilies && accessible.length === checkedFamilies) {
          return `Страницу смогли открыть все ${safeNumber(checkedFamilies)} проверенных семейств ИИ-краулеров`;
        }
        if (checkedFamilies) {
          return `Страницу открыли ${safeNumber(accessible.length)} из ${safeNumber(checkedFamilies)} проверенных семейств ИИ-краулеров`;
        }
        if (accessRate !== null) {
          return `По итогам проверок страница доступна для ИИ-краулеров на ${formatPercent(accessRate, 0)}`;
        }
        return "Для этой страницы пока нет подтверждённых результатов по ИИ-краулерам";
      };

      const checksTooltipCopy = ({ isUtility, passedChecks, totalChecks }) => {
        if (isUtility) {
          return "Служебные страницы не проходят набор проверок для содержательных страниц";
        }
        if (passedChecks !== null && totalChecks !== null) {
          return (
            `Пройдено ${safeNumber(passedChecks)} из ${safeNumber(totalChecks)} технических проверок. `
            + "Сюда входят ответ сервера, текст, доступ для ИИ и разметка"
          );
        }
        return "Для этой страницы набор технических проверок не завершён";
      };

      const schemaTooltipCopy = ({ isUtility, schemaTypes }) => {
        if (isUtility) {
          return "Служебную страницу не оцениваем по структурированной разметке";
        }
        if (schemaTypes.length) {
          return (
            "Schema.org явно объясняет ИИ, какие сущности находятся на странице. "
            + `Найдены типы: ${schemaTypes.join(", ")}`
          );
        }
        return (
          "Schema.org не найдена. Страница остаётся доступной, "
          + "но ИИ получает меньше явных подсказок о её содержании"
        );
      };

      const scoreInclusionTooltipCopy = (isUtility) => (
        isUtility
          ? "Страница служебная, поэтому не влияет на итоговый технический балл"
          : "Результаты этой страницы входят в итоговый технический балл"
      );

      const technicalPagesHTML = (pages) => {
        if (!Array.isArray(pages) || !pages.length) {
          return `<p class="bar-unknown">Для постраничной таблицы данных пока недостаточно.</p>`;
        }
        const rows = pages.map((page, rowIndex) => {
          const accessible = Array.isArray(page?.accessible_families)
            ? page.accessible_families
            : [];
          const blocked = Array.isArray(page?.blocked_families)
            ? page.blocked_families
            : [];
          const isUtility = page?.is_utility === true;
          const accessRate = finiteNumber(page?.access_rate);
          const accessText = isUtility
            ? "Не проверяем"
            : accessRate !== null
            ? formatPercent(accessRate, 0)
            : accessible.length
            ? `${accessible.length} сем. доступно`
            : blocked.length
            ? "Доступ ограничен"
            : "Не определено";
          const schemaTypes = Array.isArray(page?.structured_data_types)
            ? page.structured_data_types.filter(Boolean)
            : [];
          const textLength = firstFinite(page?.text_length, page?.server_text_length);
          const httpStatus = finiteNumber(page?.http_status);
          const passedChecks = finiteNumber(page?.passed_checks);
          const totalChecks = finiteNumber(page?.total_checks);
          const checksText = isUtility
            ? "Не проверяем"
            : passedChecks !== null && totalChecks !== null
            ? `${safeNumber(passedChecks)} из ${safeNumber(totalChecks)}`
            : "Не измерялись";
          const schemaText = isUtility
            ? "Не проверяем"
            : schemaTypes.length
            ? schemaTypes.join(", ")
            : "Не найдена";
          const renderText = renderStrategyLabel(page?.render_strategy);
          const scoreLabel = isUtility ? "Исключена" : "Учитывается";
          const tooltipPrefix = `page-audit-${rowIndex}`;
          const title = page?.title || compactURL(page?.url) || "Страница";
          const urlLabel = compactURL(page?.url);
          return `
            <tr>
              <td class="data-table-page" data-label="Страница">
                <strong>${escapeHTML(title)}</strong>
                ${urlLabel && urlLabel !== title ? `<small>${escapeHTML(urlLabel)}</small>` : ""}
                <small>${escapeHTML(pageKindLabel(page?.page_kind))}${page?.is_utility ? " · служебная" : ""}</small>
              </td>
              <td data-label="HTTP">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-http-help`,
                  visibleHTML: `<strong>${httpStatus === null ? "—" : safeNumber(httpStatus)}</strong>`,
                  title: httpStatus === null ? "Ответ сервера не определён" : `Ответ сервера: ${safeNumber(httpStatus)}`,
                  copy: httpTooltipCopy(httpStatus, textLength),
                  controlLabel: "Пояснение к ответу сервера и объёму текста"
                })}
                ${textLength !== null ? `<small>${safeNumber(textLength)} знаков текста</small>` : ""}
              </td>
              <td data-label="Рендеринг">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-rendering-help`,
                  visibleHTML: `<strong>${escapeHTML(renderText)}</strong>`,
                  title: "Как появляется основной текст",
                  copy: renderingTooltipCopy(page?.render_strategy, page?.render_confidence),
                  controlLabel: `Пояснение к способу рендеринга «${renderText}»`
                })}
                ${page?.render_confidence ? `<small>${escapeHTML(stateLabel(page.render_confidence))}</small>` : ""}
              </td>
              <td data-label="Доступ ИИ">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-access-help`,
                  visibleHTML: `<strong>${escapeHTML(accessText)}</strong>`,
                  title: "Доступ для ИИ-краулеров",
                  copy: accessTooltipCopy({ isUtility, accessRate, accessible, blocked }),
                  controlLabel: `Пояснение к доступу ИИ: ${accessText}`
                })}
                ${!isUtility && accessible.length ? `<small>${escapeHTML(accessible.join(", "))}</small>` : ""}
              </td>
              <td data-label="Проверки">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-checks-help`,
                  visibleHTML: `<strong>${escapeHTML(checksText)}</strong>`,
                  title: "Технические проверки",
                  copy: checksTooltipCopy({ isUtility, passedChecks, totalChecks }),
                  controlLabel: `Пояснение к результату проверок: ${checksText}`
                })}
              </td>
              <td data-label="Schema.org">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-schema-help`,
                  visibleHTML: `<strong>${escapeHTML(schemaText)}</strong>`,
                  title: "Машинное описание страницы",
                  copy: schemaTooltipCopy({ isUtility, schemaTypes }),
                  controlLabel: `Пояснение к разметке Schema.org: ${schemaText}`
                })}
              </td>
              <td data-label="В оценке">
                ${auditTooltipHTML({
                  id: `${tooltipPrefix}-score-help`,
                  visibleHTML: statusPillHTML(
                    isUtility ? "limited" : "good",
                    scoreLabel
                  ),
                  title: isUtility ? "Не влияет на балл" : "Влияет на балл",
                  copy: scoreInclusionTooltipCopy(isUtility),
                  controlLabel: `Пояснение к статусу «${scoreLabel}»`
                })}
              </td>
            </tr>
          `;
        }).join("");
        return `
          <div class="data-table-wrap">
            <table class="data-table page-audit-table">
              <colgroup>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
              </colgroup>
              <thead>
                <tr>
                  <th class="data-table-page" scope="col">Страница</th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-http-help",
                      "HTTP и текст",
                      "Показывает, ответил ли сервер и сколько читаемого текста получил краулер"
                    )}
                  </th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-rendering-help",
                      "Рендеринг",
                      "Показывает, есть ли основной текст сразу в HTML или появляется только после запуска JavaScript"
                    )}
                  </th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-access-help",
                      "Доступ ИИ",
                      "Доля проверенных семейств ИИ-краулеров, которые смогли открыть страницу"
                    )}
                  </th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-checks-help",
                      "Проверки",
                      "Сколько технических проверок страницы завершилось успешно"
                    )}
                  </th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-schema-help",
                      "Schema.org",
                      "Разметка, которая прямо называет для ИИ сущности страницы: организацию, услугу, статью и другие типы"
                    )}
                  </th>
                  <th scope="col">
                    ${auditHeaderTooltipHTML(
                      "page-audit-header-score-help",
                      "В оценке",
                      "Показывает, влияет ли страница на итоговый технический балл"
                    )}
                  </th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      };

      const technicalFindingsHTML = (technical) => {
        const candidates = [
          ...(Array.isArray(technical?.review?.findings) ? technical.review.findings : []),
          ...(Array.isArray(technical?.findings) ? technical.findings : []),
          ...(Array.isArray(technical?.barriers) ? technical.barriers : [])
        ];
        const seen = new Set();
        const findings = candidates.filter((finding) => {
          const key = String(finding?.title || "").trim().toLocaleLowerCase("ru-RU");
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        if (!findings.length) {
          return `<p class="bar-unknown">Подтверждённых технических проблем в этом срезе нет.</p>`;
        }
        const severityLabels = {
          critical: "Критично",
          important: "Важно",
          observation: "Наблюдение"
        };
        return `
          <div class="data-table-wrap">
            <table class="data-table audit-actions-table">
              <thead>
                <tr>
                  <th scope="col">Приоритет</th>
                  <th scope="col">Вывод</th>
                  <th scope="col">Доказательство</th>
                  <th scope="col">Почему важно</th>
                  <th scope="col">Действие</th>
                </tr>
              </thead>
              <tbody>
                ${findings.map((finding) => {
                  const severity = ["critical", "important", "observation"].includes(finding?.severity)
                    ? finding.severity
                    : "observation";
                  const pillState = severity === "critical"
                    ? "bad"
                    : severity === "important"
                    ? "limited"
                    : "good";
                  return `
                    <tr>
                      <td data-label="Приоритет">
                        ${statusPillHTML(pillState, severityLabels[severity])}
                      </td>
                      <td data-label="Вывод"><strong>${escapeHTML(finding?.title || "Без названия")}</strong></td>
                      <td data-label="Доказательство">${escapeHTML(finding?.evidence || "Не указано")}</td>
                      <td data-label="Почему важно">${escapeHTML(finding?.business_effect || "Влияние не описано")}</td>
                      <td data-label="Действие">${escapeHTML(finding?.action || "Дополнительных действий не требуется")}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      };

      const technicalTableDisclosureHTML = ({
        title,
        description,
        content
      }) => `
        <details class="audit-section audit-disclosure" data-technical-table-disclosure>
          <summary>
            <span class="audit-disclosure-copy">
              <span class="audit-section-title" role="heading" aria-level="3">
                ${escapeHTML(title)}
              </span>
              <span class="audit-disclosure-note">${escapeHTML(description)}</span>
            </span>
          </summary>
          <div class="audit-disclosure-body">
            ${content}
          </div>
        </details>
      `;

      const illustrationHTML = (item, index) => {
        if (!item) return "";
        const safeURL = typeof item.file_url === "string" && item.file_url.startsWith("/static/generated/")
          ? item.file_url
          : null;
        return `
          <figure class="illustration">
            <div class="illustration-media">
              ${safeURL
                ? `<img
                    src="${escapeHTML(safeURL)}"
                    width="1600"
                    height="900"
                    loading="${index === 0 ? "eager" : "lazy"}"
                    alt="${escapeHTML(item.alt_text || "")}"
                  >`
                : `<div class="illustration-placeholder">
                    Схема появится после повторного завершения генерации.
                  </div>`
              }
            </div>
            <figcaption class="illustration-caption">
              <h3 class="illustration-title">${escapeHTML(item.title || "")}</h3>
              <p class="illustration-copy">${escapeHTML(item.caption || "")}</p>
            </figcaption>
          </figure>
        `;
      };

      const reportCoverHTML = (sitePreview, domain, brandName) => {
        const fallbackURL = "/static/brand/generated/aiv-report-cover.webp";
        const safePreviewURL = (
          typeof sitePreview?.file_url === "string"
          && /^\/static\/generated\/[0-9a-f-]{36}\/site-preview-[0-9a-f]{12}\.jpg$/.test(
            sitePreview.file_url
          )
        )
          ? sitePreview.file_url
          : null;
        const safeDomain = String(domain || "").trim() || brandName;
        const previewAlt = `Первый экран сайта ${safeDomain} на момент проверки.`;
        const fallbackAlt = (
          "Схема трёх измерений: доступ сайта, присутствие бренда "
          + "в ответах ИИ и сопоставление двух режимов исследования."
        );
        return `
          <figure class="report-cover${safePreviewURL ? " report-cover--site" : ""}" data-report-cover>
            <img
              src="${escapeHTML(safePreviewURL || fallbackURL)}"
              width="${safePreviewURL ? Number(sitePreview.width) || 1440 : 1600}"
              height="${safePreviewURL ? Number(sitePreview.height) || 900 : 1000}"
              alt="${escapeHTML(safePreviewURL ? previewAlt : fallbackAlt)}"
              fetchpriority="high"
              decoding="async"
              referrerpolicy="no-referrer"
              data-report-cover-image
              data-fallback-src="${fallbackURL}"
              data-fallback-alt="${escapeHTML(fallbackAlt)}"
            >
          </figure>
        `;
      };

      const bindReportCoverFallback = () => {
        const image = document.querySelector("[data-report-cover-image]");
        if (!image) return;
        image.addEventListener("error", () => {
          if (image.dataset.fallbackApplied === "true") return;
          image.dataset.fallbackApplied = "true";
          image.src = image.dataset.fallbackSrc || "/static/brand/generated/aiv-report-cover.webp";
          image.alt = image.dataset.fallbackAlt || "Схема показателей отчёта.";
          image.closest("[data-report-cover]")?.classList.remove("report-cover--site");
        });
      };

      const hideAuditTooltip = () => {
        if (!activeAuditTooltip) return;
        activeAuditTooltip.bubble.classList.remove("is-visible");
        activeAuditTooltip = null;
      };

      const showAuditTooltip = (wrapper) => {
        const bubble = wrapper?.querySelector("[data-audit-tooltip-bubble]");
        const anchor = wrapper?.querySelector("[data-audit-tooltip-anchor]");
        if (!bubble || !anchor) return;
        if (activeAuditTooltip?.bubble !== bubble) hideAuditTooltip();

        bubble.classList.remove("is-visible", "is-below");
        bubble.style.left = "0px";
